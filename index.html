<!doctype html>
<html lang="ko">
<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: a color portrait over a blurred wash of itself (like Apple Music's Now Playing), their words as the hero.
   iOS system type and controls; every person carries one system tint that recolors the UI. Swipe like a carousel. */
:root {
  --black: #000;
  --label: #fff;
  --label-2: rgba(235, 235, 245, .66);
  --label-3: rgba(235, 235, 245, .34);
  --fill: rgba(118, 118, 128, .30);
  --fill-2: rgba(118, 118, 128, .18);
  --sep: rgba(255, 255, 255, .16);
  --sheet: rgba(24, 24, 26, .84);
  --destructive: #ff453a;
  --tint: #ff375f;          /* replaced per person */
  --on-tint: #fff;
  --tint-text: color-mix(in oklab, var(--tint) 72%, white);

  --f-display: -apple-system, "SF Pro Display", BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
  --f-text: -apple-system, "SF Pro Text", BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
  --f-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  --f-ja: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;

  --gutter: 20px;
  color-scheme: dark;
}

html, body { height: 100%; background: var(--black); color: var(--label); }
body {
  margin: 0; overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  -webkit-font-smoothing: antialiased;
  font-family: var(--f-text);
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--tint-text); text-decoration: none; }
:focus-visible { outline: 2px solid var(--tint-text); outline-offset: 3px; }

.glass {
  background: rgba(255, 255, 255, .14);
  -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8);
  box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .22);
}

.app { position: fixed; inset: 0; display: flex; justify-content: center; background: var(--black); }
.stage {
  position: relative; width: 100%; height: 100%;
  max-width: 62vh; max-width: 60dvh;
  overflow: hidden; background: var(--black);
  touch-action: none; cursor: grab; outline: none;
}
.stage.dragging { cursor: grabbing; }
@media (max-aspect-ratio: 3/4) { .stage { max-width: none; } }

/* ── cards ─────────────────────────────────── */
.deck { position: absolute; inset: 0; }
.card { position: absolute; inset: 0; overflow: hidden; background: var(--black); will-change: transform; }
.card.enter { animation: enter .7s ease both; }
@keyframes enter { from { opacity: 0; } to { opacity: 1; } }

.wash {
  position: absolute; inset: -12%;
  background-size: cover; background-position: center;
  filter: blur(18px) saturate(1.25);
}
.wash::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.28) 50%, rgba(0,0,0,.6) 100%);
}
.photo { position: absolute; inset: 0; overflow: hidden; }
.kb { position: absolute; inset: 0; animation: kb 16s cubic-bezier(.2, .6, .3, 1) both; }
@keyframes kb { from { transform: scale(1.07); } to { transform: scale(1); } }
.photo img {
  position: absolute; left: 0; top: 0; max-width: none; user-select: none; -webkit-user-drag: none; pointer-events: none;
  -webkit-mask-image: linear-gradient(180deg, #000 62%, transparent 96%);
  mask-image: linear-gradient(180deg, #000 62%, transparent 96%);
}
.top-shade { position: absolute; left: 0; right: 0; top: 0; height: 140px; background: linear-gradient(180deg, rgba(0,0,0,.42), rgba(0,0,0,0)); pointer-events: none; }

.copy {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 0 var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 22px);
  display: flex; flex-direction: column; gap: 12px;
}

.qmark { display: block; height: 30px; margin-bottom: -2px; font: 800 72px/1 var(--f-display); color: var(--tint-text); }
.quote { margin: 0; font: 700 31px/1.14 var(--f-display); letter-spacing: -.028em; text-wrap: balance; }
.quote.m { font-size: 27px; line-height: 1.17; }
.quote.l { font-size: 23.5px; line-height: 1.22; }
.quote.xl { font-size: 20.5px; line-height: 1.27; letter-spacing: -.02em; }
.quote.roman { font: 800 72px/1 var(--f-round); letter-spacing: .01em; }
.quote:lang(ja) { font-family: var(--f-ja); font-weight: 700; letter-spacing: .02em; line-height: 1.45; }
.quote:lang(ko), .orig blockquote:lang(ko) { word-break: keep-all; letter-spacing: -.035em; }
.ko { margin: 0; font: 400 17px/1.5 var(--f-text); letter-spacing: -.012em; color: var(--label-2); word-break: keep-all; text-wrap: pretty; }

.byline { display: flex; align-items: center; gap: 12px; margin-top: 6px; padding-top: 14px; border-top: .5px solid var(--sep); }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.name { font: 600 17px/1.25 var(--f-text); letter-spacing: -.02em; }
.role { font: 400 13px/1.35 var(--f-text); color: var(--label-2); word-break: keep-all; }
.more {
  flex: none; display: inline-flex; align-items: center; gap: 5px;
  padding: 9px 14px; border-radius: 999px; font: 600 15px/1 var(--f-text); letter-spacing: -.01em;
}
.more svg { width: 12px; height: 12px; }
.more:active, .pill:active { transform: scale(.96); }

/* someone with no free photo: their tint as a soft field, their initials as a watermark */
.nophoto .wash {
  inset: 0; filter: none;
  background:
    radial-gradient(70% 50% at 22% 20%, color-mix(in oklab, var(--tint) 75%, transparent), transparent 70%),
    radial-gradient(60% 45% at 85% 42%, color-mix(in oklab, var(--tint) 45%, #5e5ce6 25%), transparent 70%),
    #0b0b0d;
}
.initial {
  position: absolute; left: 0; right: 0; top: 16%; text-align: center;
  font: 800 clamp(120px, 44vw, 210px)/1 var(--f-round); letter-spacing: -.04em;
  color: rgba(255, 255, 255, .12); pointer-events: none;
}

/* the viewer's own card */
.tally { display: flex; align-items: baseline; gap: 4px; }
.num {
  font: 800 clamp(84px, 26vw, 112px)/.92 var(--f-round); letter-spacing: -.045em;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #fff 35%, color-mix(in oklab, var(--tint) 60%, white));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  padding-right: .04em;
}
.unit { font: 700 34px/1 var(--f-round); letter-spacing: -.02em; color: var(--tint-text); }
.since { margin-top: -2px; font: 600 15px/1.3 var(--f-text); letter-spacing: -.01em; color: var(--label-2); }
.you .wash {
  inset: 0; filter: none;
  background:
    radial-gradient(60% 45% at 18% 18%, rgba(255, 55, 95, .70), transparent 70%),
    radial-gradient(55% 45% at 86% 30%, rgba(255, 159, 10, .55), transparent 70%),
    radial-gradient(70% 50% at 50% 78%, rgba(191, 90, 242, .50), transparent 70%),
    #0b0b0d;
}
.ring-wrap { position: absolute; left: 50%; top: 33%; width: 64%; max-width: 280px; aspect-ratio: 1; transform: translate(-50%, -50%); }
.ring { width: 100%; height: 100%; display: block; }
.ring .track { stroke: rgba(255, 255, 255, .14); }
.ring .bar { transition: stroke-dashoffset 1.4s cubic-bezier(.3, .7, .2, 1) .2s; }
.card.live .ring .bar { stroke-dashoffset: var(--off); }
.ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.ring-label span { font: 600 13px/1 var(--f-text); color: var(--label-2); }
.ring-label b { font: 800 44px/1 var(--f-round); letter-spacing: -.03em; }
.ring-label em { font: 600 13px/1 var(--f-text); font-style: normal; color: #ffb340; }

/* ── chrome ────────────────────────────────── */
.top {
  position: absolute; left: 0; right: 0; top: 0; z-index: 3;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--gutter) 0;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.mark { display: flex; align-items: center; gap: 7px; font: 700 19px/1 var(--f-round); letter-spacing: -.01em; }
.mark svg { width: 22px; height: 22px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 14px; border-radius: 999px;
  font: 600 14px/1 var(--f-text); letter-spacing: -.01em;
  transition: transform .15s ease;
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tint); box-shadow: 0 0 10px var(--tint); }
.pill.unset { color: var(--label-2); }

.hint {
  position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 3;
  display: flex; justify-content: center; pointer-events: none; transition: opacity .6s ease;
}
.hint span { font: 500 13px/1 var(--f-text); padding: 10px 15px; border-radius: 999px; color: var(--label); }
.hint.gone { opacity: 0; }

.update {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 4; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  padding: 10px 16px; border-radius: 999px; font: 600 14px/1 var(--f-text); letter-spacing: -.01em;
}
.update .dot { width: 8px; height: 8px; border-radius: 50%; background: #30d158; box-shadow: 0 0 10px #30d158; }

/* ── sheets ────────────────────────────────── */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.38); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 50%; bottom: 0; z-index: 11; box-sizing: border-box;
  width: 100%; max-width: 62vh; max-width: 60dvh; max-height: 86%;
  transform: translate(-50%, 104%); transition: transform .5s cubic-bezier(.2, .85, .2, 1);
  background: var(--sheet);
  -webkit-backdrop-filter: blur(40px) saturate(1.8); backdrop-filter: blur(40px) saturate(1.8);
  border-radius: 30px 30px 0 0; box-shadow: 0 -10px 50px rgba(0,0,0,.45), inset 0 .5px 0 rgba(255,255,255,.12);
  overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  padding: 8px var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 28px);
  user-select: text; -webkit-user-select: text; cursor: auto;
}
@media (max-aspect-ratio: 3/4) { .sheet { max-width: none; } }
.sheet.open { transform: translate(-50%, 0); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.28); margin: 0 auto 14px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.x { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--fill); color: var(--label-2); display: grid; place-items: center; }
.x svg { width: 12px; height: 12px; }

.s-name { margin: 2px 0 0; font: 700 28px/1.15 var(--f-display); letter-spacing: -.025em; text-wrap: balance; }
.s-sub { margin: 6px 0 0; font: 400 15px/1.4 var(--f-text); color: var(--label-2); word-break: keep-all; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 22px 0 0; }
.facts div { background: var(--fill-2); border-radius: 18px; padding: 14px 16px; min-width: 0; }
.facts dt { font: 600 13px/1 var(--f-text); color: var(--label-2); }
.facts dd { margin: 9px 0 0; font: 700 22px/1.1 var(--f-round); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.facts div:last-child dd { color: var(--tint-text); }
.story { margin: 22px 0 0; font: 400 17px/1.62 var(--f-text); letter-spacing: -.012em; word-break: keep-all; }
.s-h { margin: 30px 0 12px; font: 700 22px/1.2 var(--f-display); letter-spacing: -.02em; }
.quotes { display: flex; flex-direction: column; gap: 10px; }
.orig { margin: 0; padding: 16px 18px; background: var(--fill-2); border-radius: 18px; }
.orig.now { box-shadow: inset 0 0 0 1.5px var(--tint); }
.orig blockquote { margin: 0; font: 600 17px/1.4 var(--f-display); letter-spacing: -.015em; }
.orig blockquote:lang(ja) { font-family: var(--f-ja); }
.orig p { margin: 6px 0 0; font: 400 15px/1.5 var(--f-text); color: var(--label-2); word-break: keep-all; }
.orig figcaption { margin-top: 8px; font: 400 13px/1.45 var(--f-text); color: var(--label-3); }
.credit { margin: 18px 4px 0; font: 400 12px/1.5 var(--f-text); color: var(--label-3); word-break: break-word; }
.credit a { color: var(--label-2); }

.me-sheet h2 { margin: 2px 0 0; font: 700 28px/1.15 var(--f-display); letter-spacing: -.025em; }
.me-sheet p { margin: 10px 0 0; font: 400 15px/1.55 var(--f-text); color: var(--label-2); word-break: keep-all; }
.field {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-top: 22px; min-height: 54px; padding: 0 16px; border-radius: 16px; background: var(--fill-2);
}
.field label { font: 400 17px/1 var(--f-text); }
.field input {
  flex: 1; min-width: 0; height: 54px; border: 0; background: transparent; text-align: right;
  font: 400 17px/1 var(--f-text); color: var(--tint-text);
  -webkit-appearance: none; appearance: none;
}
.field input::-webkit-date-and-time-value { text-align: right; }
.btn { display: block; width: 100%; min-height: 52px; border-radius: 999px; font: 600 17px/1 var(--f-text); letter-spacing: -.01em; }
.btn.primary { margin-top: 16px; background: var(--tint); color: var(--on-tint); }
.btn.plain { margin-top: 6px; color: var(--destructive); }
.me-note { text-align: center; font-size: 13px !important; color: var(--label-3) !important; }

@media (prefers-reduced-motion: reduce) {
  .kb, .card.enter { animation: none; }
  .sheet, .scrim, .ring .bar { transition-duration: .01s !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage" tabindex="0" aria-label="옆으로 밀어서 다음 사람">
    <div class="deck" id="deck"></div>

    <header class="top">
      <div class="mark" aria-label="AA">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" aria-hidden="true"><circle cx="20" cy="20" r="17.5"/><path d="M20 8.5 L30.5 27 H9.5 Z"/></svg>
        AA
      </div>
      <button class="pill glass unset" id="me" type="button">+ 나의 시작일</button>
    </header>

    <div class="hint gone" id="hint" aria-hidden="true"><span class="glass">옆으로 밀면 다음 사람 · 위로 밀면 이야기</span></div>
    <button class="update glass" id="update" type="button" hidden><span class="dot"></span>새 버전이 나왔어요 · 탭해서 적용</button>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="story" role="dialog" aria-modal="true" aria-labelledby="s-name" inert>
  <div class="grab"></div>
  <div class="sheet-head">
    <div>
      <h2 class="s-name" id="s-name"></h2>
      <p class="s-sub" id="s-sub"></p>
    </div>
    <button class="x" type="button" data-close aria-label="닫기"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
  </div>
  <dl class="facts" id="s-facts">
    <div><dt>금주 시작</dt><dd id="s-since"></dd></div>
    <div><dt id="s-count-label">지난 날</dt><dd id="s-count"></dd></div>
  </dl>
  <p class="story" id="s-story"></p>
  <h3 class="s-h" id="s-h">이 사람이 한 말</h3>
  <div class="quotes" id="s-quotes"></div>
  <p class="credit" id="s-credit"></p>
</section>

<section class="sheet me-sheet" id="mine" role="dialog" aria-modal="true" aria-labelledby="m-title" inert>
  <div class="grab"></div>
  <div class="sheet-head">
    <h2 id="m-title">나의 시작일</h2>
    <button class="x" type="button" data-close aria-label="닫기"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
  </div>
  <p>마지막 잔을 내려놓은 다음 날을 넣어 두면, 오른쪽 위에 지난 날이 뜨고 내 카드도 명단 사이에 섞여 나와요.</p>
  <div class="field">
    <label for="my-start">시작일</label>
    <input type="date" id="my-start">
  </div>
  <button class="btn primary" type="button" id="my-save">저장</button>
  <button class="btn plain" type="button" id="my-clear">기록 지우기</button>
  <p class="me-note">이 기기에만 저장돼요.</p>
</section>

<script>
/* ────────────────────────────────────────────────────────────
   DATA
   since:   "YYYY-MM-DD" | "YYYY-MM" | "YYYY"   (이야기 화면에서 매일 자동 계산)
   approx:  연도가 추정일 때 true
   tint:    TINTS의 키 (카드와 화면 전체의 포인트 색)
   photos:  [파일 이름, 얼굴 중심 [x, y] (0–1)]  — 볼 때마다 이 중 하나
   quotes:  { t: 원문, ko: 번역, s: [출처, 링크] } — 볼 때마다 이 중 하나
   ──────────────────────────────────────────────────────────── */
const TINTS = {   // iOS 다크 모드 시스템 색상
  red:    ["#ff453a", "#fff"],
  orange: ["#ff9f0a", "#000"],
  yellow: ["#ffd60a", "#000"],
  green:  ["#30d158", "#000"],
  mint:   ["#63e6e2", "#000"],
  teal:   ["#40cbe0", "#000"],
  cyan:   ["#64d2ff", "#000"],
  blue:   ["#0a84ff", "#fff"],
  indigo: ["#5e5ce6", "#fff"],
  purple: ["#bf5af2", "#fff"],
  pink:   ["#ff375f", "#fff"],
};

const PEOPLE = [
  { id: "hopkins", name: "Anthony Hopkins", ko: "앤서니 홉킨스", role: "배우 · 〈양들의 침묵〉", tint: "red", since: "1975-12-29",
    photos: [["hopkins", [.52, .31]], ["hopkins-2", [.50, .43]]],
    quotes: [
      { t: "It's all over. Now you can start living.", ko: "다 끝났다. 이제부터 살면 된다.", s: ["1975년 그날 들린 내면의 목소리 · Fox News, 2025", "https://www.foxnews.com/entertainment/anthony-hopkins-credits-divinity-life-force-instant-end-alcohol-cravings"] },
      { t: "And it has all been for a purpose, so don't forget one moment of it.", ko: "그 모든 건 이유가 있었으니, 한순간도 잊지 마라.", s: ["Fox News, 2025", "https://www.foxnews.com/entertainment/anthony-hopkins-credits-divinity-life-force-instant-end-alcohol-cravings"] },
      { t: "Because life is much better.", ko: "인생이 훨씬 낫거든요.", s: ["Instagram, 2025 · E! News 보도", "https://www.eonline.com/news/1426684/anthony-hopkins-50-years-sober-message-to-fans"] },
      { t: "Choose life instead of the opposite.", ko: "그 반대 말고, 삶을 택하세요.", s: ["Instagram, 2025 · E! News 보도", "https://www.eonline.com/news/1426684/anthony-hopkins-50-years-sober-message-to-fans"] },
    ],
    story: "1975년 12월 29일, 블랙아웃 상태로 차를 몰다 누군가를, 혹은 자신을 죽일 수도 있었다는 걸 깨달았다. 그 순간 내면에서 강한 목소리가 들렸고, 그 뒤로 술 생각이 사라졌다고 한다. 금주 50년이 되던 2025년엔 인스타그램에 영상을 올려 술 문제가 있다면 한번 알아보라고 권했다." },

  { id: "downey", name: "Robert Downey Jr.", ko: "로버트 다우니 주니어", role: "배우 · 〈아이언맨〉", tint: "orange", since: "2003-07",
    photos: [["downey", [.52, .37]], ["downey-2", [.50, .34]], ["downey-3", [.43, .37]]],

      { t: "The idea that creative endeavor and mind-altering substances are entwined is one of the great pop-intellectual myths of our time.", ko: "창작과 약물이 얽혀 있다는 생각은, 우리 시대의 대표적인 얄팍한 신화예요.", s: ["『유혹하는 글쓰기(On Writing)』, 2000", "https://en.wikipedia.org/wiki/On_Writing:_A_Memoir_of_the_Craft"] },
      { t: "I was, after all, the guy who had written The Shining without even realizing that I was writing about myself.", ko: "알고 보니 나는 『샤이닝』을 쓰면서, 그게 내 이야기라는 것도 몰랐던 사람이었다.", s: ["『유혹하는 글쓰기(On Writing)』, 2000", "https://www.goodreads.com/quotes/1305004-hemingway-and-fitzgerald-didn-t-drink-because-they-were-creative-alienated"] },
    ],
    story: "『쿠조』는 쓴 기억이 거의 없을 만큼 마셨다. 1987년, 아내 태비사가 가족과 친구들 앞에서 그의 쓰레기통을 쏟아 보였다. 술을 끊으면 글도 끝날 거라 두려웠지만, 그 뒤로 40권 넘는 책을 냈다." },

  { id: "matsushige", name: "Yutaka Matsushige", ko: "마츠시게 유타카", role: "배우 · 〈고독한 미식가〉", tint: "yellow", since: "2018", approx: true, lang: "ja",
    photos: [["matsushige", [.48, .37]]],
    quotes: [
      { t: "違う世界を\n見てみたかった", ko: "다른 세계를 한번 보고 싶었어요.", s: ["술을 끊은 이유 · 일본 연예 매체 인터뷰 정리", "https://www.xn--u9jy52gkffn9q8qbux6ab4xi9c4wsx57a.com/matsushige-yutaka-geko"] },
      { t: "これがないと生きていけないと思っていたものを取っ払ったときに、…今までとは違う自分が見えてくるんです", ko: "이게 없으면 못 산다고 생각했던 걸 걷어냈을 때, 지금까지와는 다른 내가 보여요.", s: ["일본 연예 매체 인터뷰 정리", "https://www.xn--u9jy52gkffn9q8qbux6ab4xi9c4wsx57a.com/matsushige-yutaka-geko"] },
      { t: "案外すんなりやめられて、その分、甘いものを食べる時間がすごく大事になりました", ko: "생각보다 쉽게 끊었어요. 그만큼 단 걸 먹는 시간이 엄청 소중해졌죠.", s: ["인터뷰 · Berry&Moca 정리", "https://berrymoca.com/matusugeyutaka-sweets-alcohol/"] },
      { t: "『今日、スイーツは何を食べようか？』ということに、今は異常に執着しています", ko: "‘오늘 디저트는 뭘 먹지?’에 지금은 이상할 정도로 집착하고 있어요.", s: ["인터뷰 · Berry&Moca 정리", "https://berrymoca.com/matusugeyutaka-sweets-alcohol/"] },
    ],
    story: "〈고독한 미식가〉의 고로 아저씨. 원래 술을 즐겼지만 50대 중반에 끊었다. 이유는 건강이 아니라, 다른 세계를 보고 싶어서였다고. 그 뒤로 디저트에 빠졌고, 술을 못 마시는 고로와 점점 닮아가고 있다고 웃는다." },

  /* ── writers, broadcasters, history ── */
  { id: "tolstoy", name: "Leo Tolstoy", ko: "레프 톨스토이", role: "소설가 · 『전쟁과 평화』", tint: "green", since: "1887", approx: true, died: "1910-11-20",
    photos: [["tolstoy", [.57, .31]], ["tolstoy-2", [.48, .24]]],
    quotes: [
      { t: "Emancipation from this terrible evil will be an epoch in the life of humanity.", ko: "이 끔찍한 악에서 벗어나는 날은, 인류의 삶에 한 시대를 여는 날이 될 것이다.", s: ["「사람들은 왜 스스로를 마비시키는가」, 1890 · 모드 부부 번역", "https://www.marxists.org/archive/tolstoy/1890/why-do-men-stupefy-themselves/chapter-6.html"] },
      { t: "They will begin to order their lives in accord with their perceptions.", ko: "사람들은 자기가 깨달은 대로 삶을 꾸려 가기 시작할 것이다.", s: ["술에서 깨어난 사람들에 대해 · 「사람들은 왜 스스로를 마비시키는가」, 1890", "https://www.marxists.org/archive/tolstoy/1890/why-do-men-stupefy-themselves/chapter-6.html"] },
      { t: "The confusion, and above all the imbecility, of our lives, arises chiefly from the constant state of intoxication.", ko: "우리 삶의 혼란, 무엇보다 그 어리석음은 대개 늘 취해 있는 상태에서 나온다.", s: ["「사람들은 왜 스스로를 마비시키는가」, 1890", "https://www.marxists.org/archive/tolstoy/1890/why-do-men-stupefy-themselves/chapter-6.html"] },
    ],
    story: "『전쟁과 평화』와 『안나 카레니나』를 쓴 러시아의 대문호. 젊은 시절엔 술과 도박에 빠져 살았다. 50대 후반에 술과 담배를 끊고 금주 모임 ‘음주 반대 연합’을 만들었다. 1890년엔 사람들이 왜 술로 스스로를 마비시키는지 묻는 에세이를 썼다. 양심의 목소리를 덮으려고 마신다는 게 그의 답이었다." },

  { id: "carver", name: "Raymond Carver", ko: "레이먼드 카버", role: "소설가 · 『대성당』", tint: "blue", since: "1977-06-02", died: "1988-08-02",
    photos: [],
    quotes: [
      { t: "If you want the truth, I'm prouder of that, that I've quit drinking, than I am of anything in my life.", ko: "솔직히 말하면, 술을 끊은 게 내 인생 어떤 일보다 자랑스러워요.", s: ["The Paris Review, 1983", "https://www.theparisreview.org/authors/5272/raymond-carver"] },
      { t: "June second, 1977.", ko: "언제 술을 끊었느냐는 질문에, 그는 날짜로만 답했다.", s: ["The Paris Review, 1983", "https://www.theparisreview.org/authors/5272/raymond-carver"] },
      { t: "I'll always be an alcoholic, but I'm no longer a practicing alcoholic.", ko: "나는 평생 알코올 중독자일 거예요. 다만 더는 마시는 알코올 중독자가 아닐 뿐.", s: ["The Paris Review, 1983", "https://www.theparisreview.org/authors/5272/raymond-carver"] },
    ],
    story: "『대성당』과 「사소하지만 도움이 되는」을 쓴 미국 단편소설의 거장. 1970년대 중반까지 술 때문에 경찰서와 응급실, 법정을 오갔다. 1977년 6월 2일 마지막 잔을 내려놓았고, 1988년 세상을 떠날 때까지 11년을 맑은 정신으로 살았다. 대표작 대부분이 그 11년 동안 나왔다." },

  { id: "lamott", name: "Anne Lamott", ko: "앤 라모트", role: "작가 · 『쓰기의 감각』", tint: "pink", since: "1986-07-07",
    photos: [["lamott", [.50, .25]]],
    quotes: [
      { t: "Being sober delivered almost everything drinking promised.", ko: "술이 약속했던 거의 모든 걸, 술을 끊은 삶이 가져다줬어요.", s: ["Goodreads 인용", "https://www.goodreads.com/quotes/9588741-being-sober-delivered-almost-everything-drinking-promised"] },
      { t: "37 years ago today, on July 7, 1986, I got clean and sober.", ko: "37년 전 오늘, 1986년 7월 7일, 저는 술과 약을 끊었어요.", s: ["금주 기념일 Facebook, 2023", "https://www.facebook.com/AnneLamott/posts/37-years-ago-today-on-july-7-1986-i-got-clean-and-sober-it-is-the-great-miracle-/813233463498495/"] },
    ],
    story: "『쓰기의 감각』으로 한국에도 잘 알려진 미국 작가. 서른둘이던 1986년 7월 7일, 술과 약을 끊었다. 스스로 조절할 수 없다는 걸 인정하는 데만 1년이 더 걸렸다고 한다. 그 뒤로 매년 7월 7일이면 금주 기념일을 공개적으로 축하한다." },

  { id: "billw", name: "Bill W.", ko: "빌 윌슨", role: "AA(익명의 알코올 중독자들) 공동 창립자", tint: "indigo", since: "1934-12-11", died: "1971-01-24",
    photos: [["billw", [.50, .30]]],
    quotes: [
      { t: "Simple, but not easy; a price had to be paid.", ko: "간단하지만 쉽지는 않았다. 대가를 치러야 했다.", s: ["『Alcoholics Anonymous』(빅북), 1939 · 1장 「빌의 이야기」", "https://www.aa.org/sites/default/files/2021-11/en_bigbook_chapt1.pdf"] },
      { t: "I felt lifted up, as though the great clean wind of a mountain top blew through and through.", ko: "산꼭대기의 크고 맑은 바람이 온몸을 관통해 부는 것처럼, 들어 올려지는 느낌이었다.", s: ["『Alcoholics Anonymous』(빅북), 1939 · 1장 「빌의 이야기」", "https://www.aa.org/sites/default/files/2021-11/en_bigbook_chapt1.pdf"] },
      { t: "There was a sense of victory, followed by such a peace and serenity as I had never known.", ko: "승리감이 들었고, 이어서 한 번도 느껴 보지 못한 평화와 고요가 찾아왔다.", s: ["『Alcoholics Anonymous』(빅북), 1939 · 1장 「빌의 이야기」", "https://www.aa.org/sites/default/files/2021-11/en_bigbook_chapt1.pdf"] },
    ],
    story: "뉴욕의 주식 중개인이었다. 술로 모든 걸 잃어 가던 1934년 12월 11일, 마지막 잔을 마시고 병원에 들어갔다. 이듬해 의사 밥 스미스를 만나 서로의 금주를 도우며 AA를 만들었다. 알코올 중독자가 다른 알코올 중독자를 돕는 이 방식은 지금 전 세계로 퍼져 있다. 1971년 세상을 떠날 때까지 다시 마시지 않았다." },

  { id: "bford", name: "Betty Ford", ko: "베티 포드", role: "전 미국 영부인 · 베티 포드 센터 설립자", tint: "orange", since: "1978-04", died: "2011-07-08",
    photos: [["bford", [.50, .22]]],
    quotes: [
      { t: "My makeup wasn't smeared, I wasn't disheveled, I behaved politely, and I never finished off a bottle, so how could I be alcoholic?", ko: "화장이 번진 것도 흐트러진 것도 아니었고, 예의 바르게 굴었고, 병을 다 비운 적도 없었어요. 그런 내가 어떻게 알코올 중독자겠어요?", s: ["『Betty: A Glad Awakening』, 1987 · Psychology Today 정리", "https://www.psychologytoday.com/us/blog/life-in-the-recovery-room/201109/betty-ford-a-hero-remembered-during-recovery-month"] },
      { t: "I liked alcohol. It made me feel warm.", ko: "저는 술이 좋았어요. 몸이 따뜻해졌거든요.", s: ["『Betty: A Glad Awakening』, 1987", "https://www.psychologytoday.com/us/blog/life-in-the-recovery-room/201109/betty-ford-a-hero-remembered-during-recovery-month"] },
      { t: "Today I am a very grateful recovering alcoholic and I know firsthand that treatment does work.", ko: "저는 오늘, 아주 감사하는 회복 중인 알코올 중독자예요. 치료가 효과 있다는 걸 직접 알아요.", s: ["인터뷰 인용 · BrainyQuote", "https://www.brainyquote.com/authors/betty-ford-quotes"] },
    ],
    story: "제럴드 포드 대통령의 부인. 백악관을 나온 이듬해인 1978년 4월, 가족들이 모여 그녀에게 맞섰다. 처음엔 화를 냈지만 곧 치료를 받았고, 술과 진통제 중독을 공개적으로 밝혔다. 영부인의 고백은 중독을 숨겨야 할 일에서 치료할 병으로 바꿔 놓았다. 1982년엔 베티 포드 센터를 세웠다." },

  { id: "aldrin", name: "Buzz Aldrin", ko: "버즈 올드린", role: "우주비행사 · 아폴로 11호", tint: "cyan", since: "1978-10",
    photos: [["aldrin", [.48, .30]], ["aldrin-2", [.50, .35]], ["aldrin-3", [.30, .35]]],
    quotes: [
      { t: "I have many frailties and shortcomings, but I am now a far more productive person than I ever was at the peak of my astronaut career.", ko: "저는 약점도 부족한 점도 많아요. 그래도 지금이 우주비행사로 정점에 있던 때보다 훨씬 생산적인 사람이에요.", s: ["Mobilize Recovery 정리", "https://www.mobilizerecovery.org/buzz_aldrin_from_the_moon_to_recovery"] },
      { t: "If your mind is all clouded because of booze, you can't do that. So first things first.", ko: "술 때문에 머리가 흐려져 있으면 아무것도 할 수 없어요. 그러니 먼저 할 일부터.", s: ["The Fix, 2015", "https://www.thefix.com/buzz-aldrin-who-37-years-sober-reflects-family-history-mental-illness/"] },
      { t: "I've got 37 years of sobriety, but I'm still seeing a shrink.", ko: "금주 37년째지만, 아직도 상담을 받아요.", s: ["The Fix, 2015", "https://www.thefix.com/buzz-aldrin-who-37-years-sober-reflects-family-history-mental-illness/"] },
    ],
    story: "1969년, 닐 암스트롱에 이어 두 번째로 달 위를 걸었다. 지구로 돌아온 뒤 우울증과 술에 무너졌다. 달을 보고 했던 말 ‘장엄한 황량함’이 곧 자기 마음 같았다고 한다. 1978년 10월 술을 끊었고, 그 뒤로 마시지 않았다." },


  { id: "ferguson", name: "Craig Ferguson", ko: "크레이그 퍼거슨", role: "방송인 · 〈레이트 레이트 쇼〉 진행자", tint: "green", since: "1992-02-18",
    photos: [["ferguson", [.39, .33]], ["ferguson-2", [.50, .26]]],
    quotes: [
      { t: "I nearly missed the whole show.", ko: "하마터면 이 쇼 전체를 놓칠 뻔했어요.", s: ["금주 31주년 X(트위터), 2023", "https://x.com/CraigyFerg/status/1626936922302971906"] },
      { t: "I'm 25 years sober and anyone who knew me back then would tell you how impossible that is. Thanks for the miracle.", ko: "금주 25년째예요. 그 시절 저를 알던 사람이라면 그게 얼마나 불가능한 일인지 말해 줄 거예요. 기적을 고마워요.", s: ["금주 25주년 트위터, 2017 · Evening Times 보도", "https://www.eveningtimes.co.uk/news/15103331.scots-tv-star-craig-ferguson-marks-25-years-sober/"] },
    ],
    story: "스코틀랜드 출신 코미디언이자 미국 CBS 심야 토크쇼 〈레이트 레이트 쇼〉의 진행자. 1992년 2월 18일, 먼저 술을 끊은 친구에게 전화해 도움을 청했고 그 길로 재활원에 갔다. 진행자 시절엔 오프닝 전체를 자신의 알코올 중독 이야기에 쓰기도 했다." },

  { id: "maron", name: "Marc Maron", ko: "마크 마론", role: "코미디언·팟캐스터 · 〈WTF〉", tint: "yellow", since: "1999-08-09",
    photos: [["maron", [.39, .37]], ["maron-2", [.47, .22]]],
    quotes: [
      { t: "It's not a struggle or a fight or hard. It just is.", ko: "이젠 싸움도 아니고, 힘든 일도 아니에요. 그냥 그런 거예요.", s: ["WTF 블로그 〈Nineteen Years〉, 2018", "http://www.wtfpod.com/dispatches/nineteen-years"] },
      { t: "I'm amazed and happy and grateful to be sober but it is something I just am now.", ko: "술을 끊었다는 게 놀랍고 행복하고 감사해요. 그런데 이제 그건 그냥 저 자체예요.", s: ["WTF 블로그 〈Nineteen Years〉, 2018", "http://www.wtfpod.com/dispatches/nineteen-years"] },
      { t: "I was sort of in and out for years.", ko: "몇 년 동안 끊었다 마셨다를 반복했어요.", s: ["NPR 〈Fresh Air〉, 2016", "https://www.npr.org/2016/05/24/479312227/marc-maron-on-sobriety-and-managing-his-uncomfortable-comfort-zone"] },
    ],
    story: "미국 코미디언이자, 오바마 대통령까지 인터뷰한 팟캐스트 〈WTF〉의 진행자. 술과 약을 끊었다 다시 하기를 여러 해 반복했다. 1999년 8월 9일부터 멈췄다. 이제 금주는 싸움이 아니라 그냥 자기 자신이라고 말한다." },

  { id: "delaney", name: "Rob Delaney", ko: "롭 딜레이니", role: "코미디언·작가 · 〈데드풀 2〉", tint: "teal", since: "2002-02",
    photos: [["delaney", [.50, .36]]],

      { t: "Well, I can get sober for that.", ko: "그래, 이거라면 술을 끊을 수 있겠다.", s: ["1994년 이글스 재결합을 앞두고 · Parade 보도", "https://parade.com/news/classic-rock-icon-joe-walsh-makes-bold-admission-sobriety"] },
    ],
    story: "〈Hotel California〉의 이글스 기타리스트. 1970~80년대 내내 술과 코카인에 빠져 살았다. 1994년 이글스 재결합이 결정되자, 그걸 위해서라면 끊을 수 있겠다며 술을 끊었다. 지금은 AA 모임에서 자기 이야기를 들려주고, 금주를 노래한 〈One Day at a Time〉도 썼다." },

  { id: "manganiello", name: "Joe Manganiello", ko: "조 맹거니엘로", role: "배우 · 〈매직 마이크〉", tint: "teal", since: "2002",
    photos: [["manganiello", [.50, .33]], ["manganiello-2", [.50, .20]], ["manganiello-3", [.47, .36]]],
    quotes: [
      { t: "There was a point where I really thought I was broken beyond the point of being able to be fixed.", ko: "고칠 수 없을 만큼 망가졌다고 진심으로 믿었던 때가 있었어요.", s: ["E! News, 2013", "https://www.eonline.com/news/487155/joe-manganiello-reveals-he-had-a-drinking-problem-says-he-s-11-years-sober"] },
      { t: "Drinking was a way for me not to have to deal with me.", ko: "술은 나 자신을 상대하지 않아도 되는 방법이었어요.", s: ["Entertainment Tonight, 2014", "https://www.etonline.com/news/160884_joe_manganiello_opens_up_about_being_12_years_sober"] },
      { t: "It really is an inside job.", ko: "결국 이건, 내 안에서 해야 하는 일이에요.", s: ["Entertainment Tonight, 2014", "https://www.etonline.com/news/160884_joe_manganiello_opens_up_about_being_12_years_sober"] },
    ],
    story: "〈트루 블러드〉의 늑대인간, 〈매직 마이크〉의 그 근육. 20대 중반, 연기 학교를 마치고도 술 때문에 일을 잃고 빈털터리가 됐다. 2002년 친구들의 도움으로 술을 끊었고, 그때 받은 도움을 갚듯 지금도 술을 끊으려는 사람들을 돕는다." },
  /* ── words on drink from novels, plays and philosophy (kind: "text") ── */
  { id: "shakespeare", kind: "text", name: "William Shakespeare", ko: "윌리엄 셰익스피어", role: "극작가", tint: "red",
    photos: [["shakespeare", [.50, .30]]],
    quotes: [
      { t: "O God, that men should put an enemy in their mouths to steal away their brains!", ko: "아, 사람들이 제 입에 적을 들여 자기 머리를 훔쳐 가게 하다니!", w: "『오셀로』 2막 3장 · 카시오", s: ["『오셀로』(1604) · Project Gutenberg", "https://www.gutenberg.org/ebooks/1531"] },
      { t: "O thou invisible spirit of wine, if thou hast no name to be known by, let us call thee devil!", ko: "오, 보이지 않는 술의 영이여, 불릴 이름이 없다면 너를 악마라 부르겠다!", w: "『오셀로』 2막 3장 · 카시오", s: ["『오셀로』(1604) · Project Gutenberg", "https://www.gutenberg.org/ebooks/1531"] },
      { t: "I have lost the immortal part of myself, and what remains is bestial.", ko: "나의 불멸하는 부분을 잃었다. 남은 건 짐승뿐이다.", w: "『오셀로』 2막 3장 · 술에 취해 싸운 뒤 명예를 잃은 카시오", s: ["『오셀로』(1604) · Project Gutenberg", "https://www.gutenberg.org/ebooks/1531"] },
      { t: "To be now a sensible man, by and by a fool, and presently a beast!", ko: "방금까지 멀쩡한 사람이, 이윽고 바보가 되고, 곧 짐승이 되다니!", w: "『오셀로』 2막 3장 · 카시오", s: ["『오셀로』(1604) · Project Gutenberg", "https://www.gutenberg.org/ebooks/1531"] },
      { t: "Every inordinate cup is unbless'd, and the ingredient is a devil.", ko: "넘치는 잔마다 저주가 깃들어 있고, 그 안에 든 건 악마다.", w: "『오셀로』 2막 3장 · 카시오", s: ["『오셀로』(1604) · Project Gutenberg", "https://www.gutenberg.org/ebooks/1531"] },
      { t: "They clepe us drunkards, and with swinish phrase soil our addition.", ko: "다른 나라들은 우리를 술꾼이라 부르고, 돼지 같은 말로 우리 이름을 더럽힌다.", w: "『햄릿』 1막 4장 · 덴마크 궁정의 술판을 두고", s: ["『햄릿』(1601) · Project Gutenberg", "https://www.gutenberg.org/ebooks/1524"] },
    ],
    story: "『오셀로』의 카시오는 이아고의 꾐에 넘어가 술을 마시고 싸움을 벌이다 부관 자리를 잃는다. 술이 깬 뒤 그는 명예를 잃었다며 절규한다. 『햄릿』에서 햄릿은 밤마다 이어지는 덴마크 궁정의 술판 때문에 나라 전체가 술꾼 소리를 듣는다고 개탄한다. 셰익스피어에게 술은 사람을 짐승으로 만드는 것이었다." },

  { id: "dostoevsky", kind: "text", name: "Fyodor Dostoevsky", ko: "표도르 도스토옙스키", role: "소설가", tint: "orange",
    photos: [["dostoevsky", [.50, .28]]],
    quotes: [
      { t: "I drink so that I may suffer twice as much!", ko: "나는 두 배로 괴로워하려고 마신다!", w: "『죄와 벌』 · 마르멜라도프", s: ["『죄와 벌』(1866) · 콘스턴스 가넷 번역 · Project Gutenberg", "https://www.gutenberg.org/ebooks/2554"] },
      { t: "And the more I drink the more I feel it.", ko: "마시면 마실수록, 그 고통이 더 느껴진다.", w: "『죄와 벌』 · 병든 아내를 두고 마시는 마르멜라도프", s: ["『죄와 벌』(1866) · 콘스턴스 가넷 번역 · Project Gutenberg", "https://www.gutenberg.org/ebooks/2554"] },
    ],
    story: "『죄와 벌』 초반, 선술집에서 라스콜니코프를 붙잡고 끝없이 고백을 늘어놓는 퇴직 관리 마르멜라도프. 그는 병든 아내와 굶는 아이들의 돈까지 술에 쏟고, 그 죄책감을 느끼려고 또 마신다. 술은 그를 위로하지 않고 고통을 두 배로 만들 뿐이다. 그는 결국 취한 채 마차에 치여 죽는다." },


  { id: "bronte", kind: "text", name: "Anne Brontë", ko: "앤 브론테", role: "소설가", tint: "pink",
    photos: [["bronte", [.48, .36]]],
    quotes: [
      { t: "I was determined that all should be equally hateful to him.", ko: "나는 그 모든 술이 아이에게 똑같이 끔찍해지게 만들기로 했다.", w: "『와일드펠 홀의 소작인』 · 어린 아들을 두고, 헬렌", s: ["『와일드펠 홀의 소작인』(1848) · Project Gutenberg", "https://www.gutenberg.org/ebooks/969"] },
      { t: "…the taste, the smell, the sight of any one of them is sufficient to make him sick.", ko: "이제 아이는 술의 맛도, 냄새도, 보기만 해도 속이 울렁거린다고 한다.", w: "『와일드펠 홀의 소작인』 · 헬렌", s: ["『와일드펠 홀의 소작인』(1848) · Project Gutenberg", "https://www.gutenberg.org/ebooks/969"] },
    ],
    story: "『제인 에어』의 샬럿, 『폭풍의 언덕』의 에밀리와 함께 브론테 자매의 막내. 술에 무너진 남편을 떠나 아들을 데리고 도망친 여성 헬렌의 이야기를 썼다. 헬렌은 아들이 아버지를 닮지 않도록, 술만 보면 속이 울렁거리게 만든다. 앤의 오빠 브랜웰도 술과 아편으로 서른한 살에 세상을 떠났다." },

  { id: "zola", kind: "text", name: "Émile Zola", ko: "에밀 졸라", role: "소설가", tint: "teal",
    photos: [["zola", [.45, .36]]],
    quotes: [
      { t: "…the still, the machine which manufactured drunkards… with the profound trepidation of its hellish cookery.", ko: "술꾼을 찍어내는 기계, 증류기가 지옥의 요리를 끓이며 깊게 떨고 있었다.", w: "『목로주점』 · 선술집 안뜰의 증류기", s: ["『목로주점(L'Assommoir)』(1877) · 영역본 · Project Gutenberg", "https://www.gutenberg.org/ebooks/8600"] },
    ],
    story: "파리 노동자 동네를 배경으로, 성실하던 세탁부 제르베즈와 지붕공 쿠포가 술에 조금씩 삼켜지는 과정을 그린 소설. 쿠포는 결국 알코올성 섬망으로 정신병원에서 죽고, 제르베즈도 굶주림 속에 쓸쓸히 죽는다. 졸라는 술을 낭만이 아니라 가난과 함께 사람을 부수는 기계로 그렸다." },

  { id: "montaigne", kind: "text", name: "Michel de Montaigne", ko: "미셸 드 몽테뉴", role: "철학자 · 『에세』", tint: "purple",
    photos: [["montaigne", [.47, .30]]],
    quotes: [
      { t: "Drunkenness seems to me to be a gross and brutish vice.", ko: "술 취함은 내가 보기에 조잡하고 짐승 같은 악덕이다.", w: "『에세』 2권 2장 「술 취함에 대하여」", s: ["『에세』 · 찰스 코튼 번역 · Project Gutenberg", "https://www.gutenberg.org/ebooks/3600"] },
      { t: "This one is totally corporeal and earthly.", ko: "다른 악덕엔 지혜나 용기가 섞이기도 하지만, 이것만은 온전히 육체적이고 땅에 속한 것이다.", w: "『에세』 2권 2장 「술 취함에 대하여」", s: ["『에세』 · 찰스 코튼 번역 · Project Gutenberg", "https://www.gutenberg.org/ebooks/3600"] },
    ],
    story: "16세기 프랑스 철학자이자, 에세이라는 글쓰기를 처음 만든 사람. 「술 취함에 대하여」에서 그는 다른 악덕에는 지혜나 용기, 재주가 섞여 있기도 하지만, 술 취함만은 온전히 몸에 속한 것이라고 썼다." },

  { id: "seneca", kind: "text", name: "Seneca", ko: "세네카", role: "고대 로마 철학자", tint: "yellow",
    photos: [["seneca", [.47, .33]]],
    quotes: [
      { t: "Drunkenness is nothing but a condition of insanity purposely assumed.", ko: "술 취함이란 일부러 뒤집어쓴 광기일 뿐이다.", w: "『루킬리우스에게 보내는 편지』 83", s: ["『루킬리우스에게 보내는 도덕 서한』 83 · 거마어 번역 · Wikisource", "https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_83"] },
      { t: "Prolong the drunkard's condition to several days; will you have any doubt about his madness?", ko: "취한 상태를 며칠만 늘려 보라. 그래도 그가 미쳤다는 걸 의심하겠는가?", w: "『루킬리우스에게 보내는 편지』 83", s: ["『루킬리우스에게 보내는 도덕 서한』 83 · 거마어 번역 · Wikisource", "https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_83"] },
      { t: "Even as it is, the madness is no less; it merely lasts a shorter time.", ko: "지금도 광기는 조금도 덜하지 않다. 그저 더 짧게 끝날 뿐이다.", w: "『루킬리우스에게 보내는 편지』 83", s: ["『루킬리우스에게 보내는 도덕 서한』 83 · 거마어 번역 · Wikisource", "https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_83"] },
      { t: "…how often the drunkard does things which make him blush when he is sober.", ko: "술꾼은 깨고 나면 얼굴이 붉어질 일을 얼마나 자주 저지르는가.", w: "『루킬리우스에게 보내는 편지』 83", s: ["『루킬리우스에게 보내는 도덕 서한』 83 · 거마어 번역 · Wikisource", "https://en.wikisource.org/wiki/Moral_letters_to_Lucilius/Letter_83"] },
    ],
    story: "네로 황제의 스승이었던 스토아 철학자. 친구 루킬리우스에게 보낸 편지에서 술 취함을 ‘일부러 뒤집어쓴 광기’라고 불렀다. 술에 취해 친구 클레이토스를 찔러 죽인 알렉산드로스 대왕을 예로 들며, 취한 사람이 깨고 나서 부끄러워할 일을 얼마나 자주 하는지 보라고 썼다." },

  { id: "plato", kind: "text", name: "Plato", ko: "플라톤", role: "고대 그리스 철학자 · 『국가』", tint: "blue",
    photos: [["plato", [.50, .42]]],
    quotes: [
      { t: "Of all persons a guardian should be the last to get drunk and not know where in the world he is.", ko: "모든 사람 가운데, 나라를 지키는 사람이야말로 술에 취해 자기가 어디 있는지도 모르게 되어선 안 된다.", w: "『국가』 3권 · 소크라테스", s: ["『국가』 3권 · 벤저민 조잇 번역 · Project Gutenberg", "https://www.gutenberg.org/ebooks/1497"] },
      { t: "That a guardian should require another guardian to take care of him is ridiculous indeed.", ko: "지키는 사람이 자기를 지켜 줄 사람을 또 필요로 한다면, 그건 정말 우스운 일이다.", w: "『국가』 3권 · 글라우콘", s: ["『국가』 3권 · 벤저민 조잇 번역 · Project Gutenberg", "https://www.gutenberg.org/ebooks/1497"] },
    ],
    story: "『국가』에서 소크라테스는 나라를 지킬 수호자를 어떻게 길러야 하는지 이야기하며, 그들이 가장 먼저 멀리해야 할 것으로 술 취함을 꼽는다. 남을 지켜야 할 사람이 제 몸 하나 가누지 못해 남의 보살핌을 받아야 한다면 우습다는 것이다." },

  { id: "aristotle", kind: "text", name: "Aristotle", ko: "아리스토텔레스", role: "고대 그리스 철학자 · 『니코마코스 윤리학』", tint: "cyan",
    photos: [["aristotle", [.50, .32]]],
    quotes: [
      { t: "Penalties are doubled in the case of drunkenness; for the moving principle is in the man himself, since he had the power of not getting drunk.", ko: "취해서 저지른 일엔 벌을 두 배로 준다. 그 원인이 그 사람 안에 있기 때문이다. 그에겐 취하지 않을 힘이 있었다.", w: "『니코마코스 윤리학』 3권 5장", s: ["『니코마코스 윤리학』 3권 · W. D. 로스 번역 · MIT Internet Classics Archive", "https://classics.mit.edu/Aristotle/nicomachaen.3.iii.html"] },
      { t: "…his getting drunk was the cause of his ignorance.", ko: "그가 몰랐던 건, 그가 취했기 때문이다.", w: "『니코마코스 윤리학』 3권 5장", s: ["『니코마코스 윤리학』 3권 · W. D. 로스 번역 · MIT Internet Classics Archive", "https://classics.mit.edu/Aristotle/nicomachaen.3.iii.html"] },
    ],
    story: "『니코마코스 윤리학』에서 아리스토텔레스는 모르고 한 행동에도 책임이 있는지 묻고, 술에 취해 저지른 일을 대표적인 예로 든다. 취해서 몰랐다는 건 변명이 되지 않는다. 취하지 않을 수 있었던 사람은 바로 그 자신이기 때문이다." },

  { id: "proverbs", kind: "text", name: "Book of Proverbs", ko: "잠언", role: "구약성경", tint: "indigo", mark: "잠언",
    photos: [],
    quotes: [
      { t: "Wine is a mocker, strong drink is raging: and whosoever is deceived thereby is not wise.", ko: "포도주는 사람을 비웃게 하고, 독주는 사람을 날뛰게 한다. 거기에 속는 자는 지혜롭지 않다.", w: "20장 1절", s: ["잠언 20:1 · 킹 제임스 성경(KJV)", "https://bible-api.com/proverbs%2020:1?translation=kjv"] },
      { t: "Who hath woe? who hath sorrow? who hath contentions? who hath babbling? who hath wounds without cause? who hath redness of eyes?", ko: "누구에게 재앙이 있는가? 누구에게 슬픔이 있는가? 누구에게 다툼과 원망이 있는가? 누가 까닭 없이 다치고, 누구의 눈이 충혈되었는가?", w: "23장 29절", s: ["잠언 23:29–32 · 킹 제임스 성경(KJV)", "https://bible-api.com/proverbs%2023:29-32?translation=kjv"] },
      { t: "They that tarry long at the wine.", ko: "술자리에 오래 머무는 자들이다.", w: "23장 30절 · 앞 절의 물음에 대한 답", s: ["잠언 23:29–32 · 킹 제임스 성경(KJV)", "https://bible-api.com/proverbs%2023:29-32?translation=kjv"] },
      { t: "At the last it biteth like a serpent, and stingeth like an adder.", ko: "마지막엔 뱀처럼 물고, 독사처럼 쏜다.", w: "23장 32절", s: ["잠언 23:29–32 · 킹 제임스 성경(KJV)", "https://bible-api.com/proverbs%2023:29-32?translation=kjv"] },
    ],
    story: "지혜의 말을 모아 놓은 구약성경의 책. 23장에는 술에 대한 긴 경고가 있다. 재앙과 슬픔, 다툼과 까닭 없는 상처가 누구에게 있느냐고 묻고, 술자리에 오래 머무는 자들이라고 답한다. 잔 속에서 붉게 빛나는 술을 쳐다보지도 말라고, 결국엔 뱀처럼 문다고 경고한다." },

  { id: "franklin", kind: "text", name: "Benjamin Franklin", ko: "벤저민 프랭클린", role: "미국 건국의 아버지 · 『자서전』", tint: "mint",
    photos: [["franklin", [.50, .30]]],
    quotes: [
      { t: "Temperance. Eat not to dullness; drink not to elevation.", ko: "절제. 둔해질 만큼 먹지 말고, 들뜰 만큼 마시지 말라.", w: "『자서전』 · 열세 가지 덕목 중 첫 번째", s: ["『벤저민 프랭클린 자서전』 · Project Gutenberg", "https://www.gutenberg.org/ebooks/20203"] },
      { t: "I drank only water; the other workmen, near fifty in number, were great guzzlers of beer.", ko: "나는 물만 마셨다. 쉰 명 가까운 다른 일꾼들은 맥주를 들이붓는 사람들이었다.", w: "『자서전』 · 런던 인쇄소 시절", s: ["『벤저민 프랭클린 자서전』 · Project Gutenberg", "https://www.gutenberg.org/ebooks/20203"] },
      { t: "…the Water-American, as they called me, was stronger than themselves, who drank strong beer!", ko: "그들이 ‘물 마시는 미국인’이라 부르던 내가, 독한 맥주를 마시는 그들보다 더 힘이 셌다!", w: "『자서전』 · 런던 인쇄소 시절", s: ["『벤저민 프랭클린 자서전』 · Project Gutenberg", "https://www.gutenberg.org/ebooks/20203"] },
    ],
    story: "열아홉 살, 런던의 인쇄소에서 일할 때 동료들은 맥주를 마셔야 힘이 난다고 믿으며 하루 종일 마셨다. 그는 물만 마시고도 무거운 활자판을 양손에 하나씩 들고 계단을 오르내렸다. 훗날 도덕적으로 완벽해지겠다며 열세 가지 덕목을 세웠는데, 그 첫 번째가 절제였다." },

  { id: "lincoln", kind: "text", name: "Abraham Lincoln", ko: "에이브러햄 링컨", role: "제16대 미국 대통령", tint: "purple",
    photos: [["lincoln", [.50, .36]]],
    quotes: [
      { t: "The demon of intemperance ever seems to have delighted in sucking the blood of genius and of generosity.", ko: "무절제라는 악마는 늘 재능 있고 너그러운 사람의 피를 빨아먹기를 즐기는 것 같다.", w: "금주 연설, 1842", s: ["워싱턴 금주 협회 연설, 1842 · Abraham Lincoln Online", "https://www.abrahamlincolnonline.org/lincoln/speeches/temperance.htm"] },
      { t: "There seems ever to have been a proneness in the brilliant, and warm-blooded to fall into this vice.", ko: "빛나고 뜨거운 사람일수록 이 악덕에 빠지기 쉬웠던 것 같다.", w: "금주 연설, 1842", s: ["워싱턴 금주 협회 연설, 1842 · Abraham Lincoln Online", "https://www.abrahamlincolnonline.org/lincoln/speeches/temperance.htm"] },
    ],
    story: "대통령이 되기 19년 전, 서른세 살의 링컨이 스프링필드의 금주 모임에서 한 연설. 그는 술꾼을 손가락질하는 대신 같은 사람으로 대하라고 말했다. 그러면서도 술이 가장 빛나고 뜨거운 사람들을 먼저 앗아 간다고 슬퍼했다. 링컨 자신은 평생 술을 거의 마시지 않았다." },

  { id: "nietzsche", kind: "text", name: "Friedrich Nietzsche", ko: "프리드리히 니체", role: "철학자 · 『이 사람을 보라』", tint: "green",
    photos: [["nietzsche", [.47, .38]]],
    quotes: [
      { t: "A single glass of wine or beer a day is amply sufficient to turn life into a valley of tears for me.", ko: "하루 한 잔의 포도주나 맥주만으로도, 내 삶은 눈물의 골짜기가 되기에 충분하다.", w: "『이 사람을 보라』 · 「나는 왜 이렇게 영리한가」", s: ["『이 사람을 보라』(1888) · 앤서니 루도비치 번역 · Project Gutenberg", "https://www.gutenberg.org/ebooks/52190"] },
      { t: "…advise all more spiritual natures to abstain absolutely from alcohol. Water answers the purpose.", ko: "정신적인 사람이라면 누구든 술을 완전히 끊으라고 진심으로 권한다. 물이면 충분하다.", w: "『이 사람을 보라』 · 「나는 왜 이렇게 영리한가」", s: ["『이 사람을 보라』(1888) · 앤서니 루도비치 번역 · Project Gutenberg", "https://www.gutenberg.org/ebooks/52190"] },
    ],
    story: "‘신은 죽었다’의 철학자. 자기 삶을 돌아본 마지막 책 『이 사람을 보라』에서, 소년 시절엔 밤새 술을 마시며 라틴어 에세이를 쓰기도 했지만 나이가 들수록 술에 반대하게 됐다고 썼다. 정신을 다루는 사람이라면 술을 완전히 끊어야 한다는 게 그의 결론이었다." },

  /* ── psychology, neuroscience, public health, recent books (kind: "text") ── */
  { id: "james", kind: "text", name: "William James", ko: "윌리엄 제임스", role: "심리학자 · 『심리학의 원리』", tint: "mint",
    photos: [["james", [.50, .36]]],
    quotes: [
      { t: "The drunken Rip Van Winkle… excuses himself for every fresh dereliction by saying, 'I won't count this time!'", ko: "술 취한 립 밴 윙클은 또 실수를 할 때마다 ‘이번 건 안 셀 거야!’ 하며 스스로를 봐준다.", w: "『심리학의 원리』 4장 「습관」, 1890", s: ["『심리학의 원리』 1권(1890) · Project Gutenberg", "https://www.gutenberg.org/ebooks/57628"] },
      { t: "Well! he may not count it, and a kind Heaven may not count it; but it is being counted none the less.", ko: "그래, 그는 세지 않을 수도 있고, 너그러운 하늘도 세지 않을지 모른다. 그래도 그건 세어지고 있다.", w: "『심리학의 원리』 4장 「습관」, 1890", s: ["『심리학의 원리』 1권(1890) · Project Gutenberg", "https://www.gutenberg.org/ebooks/57628"] },
      { t: "Down among his nerve-cells and fibres the molecules are counting it, registering and storing it up to be used against him when the next temptation comes.", ko: "그의 신경세포와 신경섬유 깊은 곳에서 분자들이 그걸 세고, 기록하고, 쌓아 두었다가, 다음 유혹이 올 때 그에게 불리하게 쓴다.", w: "『심리학의 원리』 4장 「습관」, 1890", s: ["『심리학의 원리』 1권(1890) · Project Gutenberg", "https://www.gutenberg.org/ebooks/57628"] },
      { t: "How many excuses does the drunkard find when each new temptation comes!", ko: "새 유혹이 올 때마다 술꾼은 얼마나 많은 핑계를 찾아내는가!", w: "『심리학의 원리』 26장 「의지」, 1890", s: ["『심리학의 원리』 2권(1890) · Project Gutenberg", "https://www.gutenberg.org/ebooks/57634"] },
      { t: "…or it is just this once, and once doesn't count… it is, in fact, anything you like except being a drunkard.", ko: "…딱 이번 한 번이고, 한 번은 안 치는 거니까… 사실 그건, 술꾼 짓이라는 것만 빼면 뭐든 된다.", w: "『심리학의 원리』 26장 「의지」, 1890", s: ["『심리학의 원리』 2권(1890) · Project Gutenberg", "https://www.gutenberg.org/ebooks/57634"] },
      { t: "If through thick and thin he holds to it that this is being a drunkard and is nothing else, he is not likely to remain one long.", ko: "무슨 일이 있어도 ‘이건 술꾼 짓이고, 그 밖의 아무것도 아니다’를 붙들고 있으면, 그는 오래 술꾼으로 남지 않는다.", w: "『심리학의 원리』 26장 「의지」, 1890", s: ["『심리학의 원리』 2권(1890) · Project Gutenberg", "https://www.gutenberg.org/ebooks/57634"] },
    ],
    story: "미국 심리학의 아버지. 『심리학의 원리』에서 습관이 뇌에 새겨지는 방식을 설명하며 술꾼을 예로 든다. ‘이번 한 번은 안 셀 거야’라고 해도, 신경세포는 그 한 번을 빠짐없이 기록한다는 것이다. 의지를 다룬 장에서는 술꾼이 지어내는 핑계를 길게 늘어놓은 뒤, 그 모두를 ‘술꾼 짓’이라는 이름 하나로 부를 수 있으면 빠져나올 수 있다고 썼다." },

  { id: "jung", kind: "text", name: "Carl Jung", ko: "칼 융", role: "정신의학자 · 분석심리학의 창시자", tint: "purple",
    photos: [["jung", [.52, .32]]],
    quotes: [
      { t: "You see, alcohol in Latin is spiritus and you use the same word for the highest religious experience as well as for the most depraving poison.", ko: "라틴어로 알코올은 ‘스피리투스’, 곧 영(靈)이에요. 가장 높은 영적 경험에도, 가장 타락시키는 독에도 같은 단어를 쓰는 거죠.", w: "AA 창립자 빌 윌슨에게 보낸 편지, 1961", s: ["빌 윌슨에게 보낸 편지, 1961년 1월 30일 · AA Salt Lake 보관", "https://www.saltlakeaa.org/2015/01/spiritus-contra-spiritum-carl-jungs-letter-to-bill-wilson-january-30-1961/"] },
      { t: "The helpful formula therefore is: spiritus contra spiritum.", ko: "그러니 도움이 되는 공식은 이것입니다. 영에는 영으로(spiritus contra spiritum).", w: "AA 창립자 빌 윌슨에게 보낸 편지, 1961", s: ["빌 윌슨에게 보낸 편지, 1961년 1월 30일 · AA Salt Lake 보관", "https://www.saltlakeaa.org/2015/01/spiritus-contra-spiritum-carl-jungs-letter-to-bill-wilson-january-30-1961/"] },
      { t: "His craving for alcohol was the equivalent on a low level of the spiritual thirst of our being for wholeness.", ko: "그의 술에 대한 갈망은, 온전해지고 싶은 우리 존재의 영적 목마름이 낮은 차원에서 나타난 것이었어요.", w: "빌 윌슨에게 보낸 편지, 1961 · 옛 환자 롤랜드 H.에 대해", s: ["빌 윌슨에게 보낸 편지, 1961년 1월 30일 · AA Salt Lake 보관", "https://www.saltlakeaa.org/2015/01/spiritus-contra-spiritum-carl-jungs-letter-to-bill-wilson-january-30-1961/"] },
    ],
    story: "1930년대 초, 융은 미국인 알코올 중독 환자 롤랜드 H.에게 의학으로는 더 해 줄 게 없고, 깊은 영적 체험만이 그를 구할 수 있다고 말했다. 롤랜드는 그 말을 따라 술을 끊었고, 그 이야기가 친구를 거쳐 빌 윌슨에게 닿아 AA가 시작됐다. 30년 뒤 빌 윌슨이 감사 편지를 보내자, 융은 세상을 떠나기 넉 달 전 이렇게 답장했다." },

  { id: "mate", kind: "text", name: "Gabor Maté", ko: "가보르 마테", role: "의사 · 중독 전문가", tint: "orange",
    photos: [["mate", [.50, .28]]],
    quotes: [
      { t: "Not why the addiction, but why the pain.", ko: "왜 중독됐느냐가 아니라, 무엇이 그렇게 아팠느냐.", w: "『In the Realm of Hungry Ghosts』(2008)", s: ["『In the Realm of Hungry Ghosts』(2008) · 저자 공식 사이트", "https://drgabormate.com/book/in-the-realm-of-hungry-ghosts/"] },
      { t: "Addictions always originate in pain, whether felt openly or hidden in the unconscious.", ko: "중독은 언제나 고통에서 시작된다. 드러나게 느끼든, 무의식 속에 숨어 있든.", w: "『In the Realm of Hungry Ghosts』(2008)", s: ["『In the Realm of Hungry Ghosts』(2008) · 저자 공식 사이트", "https://drgabormate.com/book/in-the-realm-of-hungry-ghosts/"] },
    ],
    story: "캐나다 밴쿠버의 가장 가난한 동네에서 12년 동안 중독자들을 돌본 의사. 그는 중독을 의지가 약해서 생기는 병이 아니라, 고통을 잠시 마비시키려는 시도로 본다. 그래서 중독자에게 먼저 물어야 할 건 ‘왜 중독됐느냐’가 아니라 ‘무엇이 그렇게 아팠느냐’라고 말한다." },

  { id: "lembke", kind: "text", name: "Anna Lembke", ko: "애나 렘키", role: "스탠퍼드 정신의학자 · 『도파민네이션』", tint: "pink",
    photos: [["lembke", [.50, .30]]],
    quotes: [
      { t: "The relentless pursuit of pleasure (and avoidance of pain) leads to pain.", ko: "쾌락을 끝없이 좇으면(그리고 고통을 피하기만 하면) 결국 고통에 이른다.", w: "『도파민네이션』(2021)", s: ["『Dopamine Nation』(2021) · 저자 공식 사이트", "https://www.annalembke.com/dopamine-nation"] },
    ],
    story: "스탠퍼드 의대 중독 클리닉의 정신과 의사. 『도파민네이션』에서 뇌에는 쾌락과 고통을 다는 저울이 있다고 설명한다. 술 한 잔으로 쾌락 쪽이 내려가면, 뇌는 균형을 맞추려고 고통 쪽에 추를 더 얹는다. 자주 마실수록 그 추는 쌓이고, 결국 마시지 않으면 불안하고 가라앉은 상태가 기본값이 된다. 그래서 한 달쯤 완전히 끊어 저울이 돌아올 시간을 주라고 권한다." },

  { id: "who", kind: "text", name: "World Health Organization", ko: "세계보건기구(WHO)", role: "2023년 성명", tint: "blue", mark: "WHO",
    photos: [],
    quotes: [
      { t: "When it comes to alcohol consumption, there is no safe amount that does not affect health.", ko: "음주에 관해서라면, 건강에 영향을 주지 않는 안전한 양은 없다.", w: "WHO 성명, 2023년 1월", s: ["WHO 유럽 사무소 보도자료, 2023년 1월", "https://www.who.int/europe/news/item/04-01-2023-no-level-of-alcohol-consumption-is-safe-for-our-health"] },
      { t: "Alcohol is a toxic, psychoactive, and dependence-producing substance.", ko: "알코올은 독성이 있고, 정신에 작용하며, 의존을 일으키는 물질이다.", w: "WHO 성명, 2023년 1월", s: ["WHO 유럽 사무소 보도자료, 2023년 1월", "https://www.who.int/europe/news/item/04-01-2023-no-level-of-alcohol-consumption-is-safe-for-our-health"] },
      { t: "…the highest risk group, which also includes asbestos, radiation and tobacco.", ko: "술은 1군 발암물질이다. 석면, 방사선, 담배와 같은 가장 높은 위험 등급이다.", w: "WHO 성명, 2023년 1월 · 국제암연구소 분류에 대해", s: ["WHO 유럽 사무소 보도자료, 2023년 1월", "https://www.who.int/europe/news/item/04-01-2023-no-level-of-alcohol-consumption-is-safe-for-our-health"] },
    ],
    story: "2023년 1월, 세계보건기구는 『랜싯 공중보건』에 낸 성명에서 ‘적당히 마시면 괜찮다’는 통념을 정면으로 부정했다. 술은 적어도 일곱 가지 암의 원인이고, 발암 효과가 시작되는 안전한 문턱이 있다는 증거는 없다. 가볍게 마시는 술이 심장에 좋다는 주장도, 같은 양이 부르는 암 위험보다 크다는 연구는 없다고 밝혔다." },

  { id: "lancet", kind: "text", name: "The Lancet", ko: "『랜싯』 세계 질병 부담 연구", role: "2018년 논문", tint: "red", mark: "0",
    photos: [],
    quotes: [

  const [c, on] = TINTS[key] || TINTS.pink;
  root.style.setProperty("--tint", c);
  root.style.setProperty("--on-tint", on);
}

function parseSince(s) {
  const [y, m, d] = s.split("-").map(Number);
  const prec = d ? "day" : m ? "month" : "year";
  // 연도만 알면 7월 1일, 월까지만 알면 15일로 가정
  return { y, m, d, prec, date: new Date(y, (m || 7) - 1, d || (m ? 15 : 1)) };
}

function elapsed(from, to = new Date()) {
  const a = dayStart(from), b = dayStart(to);
  let years = b.getFullYear() - a.getFullYear();
  if (b.getMonth() < a.getMonth() || (b.getMonth() === a.getMonth() && b.getDate() < a.getDate())) years--;
  const days = Math.round((b - a) / 864e5);
  return { years: Math.max(0, years), days: Math.max(0, days) };
}

function sinceLong(s) {
  if (s.prec === "day") return `${s.y}년 ${s.m}월 ${s.d}일부터 금주 중`;
  if (s.prec === "month") return `${s.y}년 ${s.m}월부터 금주 중`;
  return `${s.y}년부터 금주 중`;
}
function sinceShort(s, approx) {
  if (s.prec === "day") return `${s.y}. ${s.m}. ${s.d}`;
  if (s.prec === "month") return `${s.y}. ${s.m}`;
  return `${s.y}${approx ? " 무렵" : ""}`;
}

/* ── variety: a different line and photo each time someone comes around ── */
const SEEN_KEY = "aa.lastSeen";
let lastSeen = {};
try { lastSeen = JSON.parse(store.get(SEEN_KEY) || "{}") || {}; } catch (e) { lastSeen = {}; }
function pickOther(n, last) {
  if (n <= 1) return 0;
  let i;
  do { i = Math.floor(Math.random() * n); } while (i === last);
  return i;
}
function remember(id, qi, pi) {
  lastSeen[id] = [qi, pi];
  store.set(SEEN_KEY, JSON.stringify(lastSeen));
}

/* ── my own date ─────────────────────────── */
const MY_KEY = "aa.myStart";
function myStart() {
  const v = store.get(MY_KEY);
  return v && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null;
}
function myDays() {
  const v = myStart();
  return v ? elapsed(parseSince(v).date).days : null;
}
function renderMe() {
  const btn = $("me"), d = myDays();
  if (d == null) { btn.className = "pill glass unset"; btn.textContent = "+ 나의 시작일"; return; }
  btn.className = "pill glass";
  btn.innerHTML = `<span class="dot"></span>나 · ${d === 0 ? "오늘 시작" : d.toLocaleString("ko-KR") + "일"}`;
}

// 다음 목표: 1, 3, 7, 14, 30, 60, 90, 100, 180일, 그 뒤로 1년 단위
function milestone(d) {
  const steps = [1, 3, 7, 14, 30, 60, 90, 100, 180, 365];
  let prev = 0;
  for (const m of steps) { if (d < m) return { prev, next: m }; prev = m; }
  const y = Math.floor(d / 365);
  return { prev: y * 365, next: (y + 1) * 365 };
}
function dayLabel(n) { return n >= 365 && n % 365 === 0 ? `${n / 365}년` : `${n.toLocaleString("ko-KR")}일`; }

/* ── cards ───────────────────────────────── */
function quoteClass(q, lang) {
  if (q.roman) return "quote roman";
  const n = q.t.length;
  if (lang === "ja") return n > 40 ? "quote xl" : n > 16 ? "quote l" : "quote m";
  if (lang === "ko") return n > 60 ? "quote xl" : n > 38 ? "quote l" : n > 20 ? "quote m" : "quote";
  return n > 110 ? "quote xl" : n > 72 ? "quote l" : n > 40 ? "quote m" : "quote";
}

function buildYou() {
  const s = parseSince(myStart()), d = elapsed(s.date).days, ms = milestone(d);
  const R = 84, C = 2 * Math.PI * R, prog = Math.min(1, (d - ms.prev) / (ms.next - ms.prev));
  const card = document.createElement("article");
  card.className = "card you";
  card.style.cssText = tintVars(YOU_TINT);
  card.innerHTML = `
    <div class="wash"></div>
    <div class="ring-wrap" aria-hidden="true">
      <svg class="ring" viewBox="0 0 200 200">
        <defs><linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff375f"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient></defs>
        <circle class="track" cx="100" cy="100" r="${R}" fill="none" stroke-width="22"/>
        <circle class="bar" cx="100" cy="100" r="${R}" fill="none" stroke="url(#ring-grad)" stroke-width="22" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C}" style="--off:${C * (1 - Math.max(prog, .015))}" transform="rotate(-90 100 100)"/>
      </svg>
      <div class="ring-label"><span>다음 목표</span><b>${dayLabel(ms.next)}</b><em>${(ms.next - d).toLocaleString("ko-KR")}일 남음</em></div>
    </div>
    <div class="copy">
      <div class="tally"><span class="num">${d.toLocaleString("ko-KR")}</span><span class="unit">일</span></div>
      <div class="since">${d === 0 ? "오늘부터 금주 시작" : sinceLong(s)}</div>
      <div class="byline"><div class="who"><span class="name">나</span><span class="role">나의 기록</span></div>
        <button class="more glass" type="button" data-mine>날짜 ${CHEVRON_UP}</button></div>
    </div>`;
  card._ready = Promise.resolve();
  return card;
}

// `keep` holds the line and photo already shown for this spot in the history,
// so swiping back brings up exactly what was on screen before.
function buildCard(id, keep = {}) {
  if (id === "you") return buildYou();
  const p = BY_ID[id], lang = p.lang || "en", seen = lastSeen[id] || [];
  const qi = keep.qi != null ? keep.qi : pickOther(p.quotes.length, seen[0]);
  const pi = keep.pi != null ? keep.pi : pickOther(p.photos.length, seen[1]);
  const q = p.quotes[qi], [file, focus] = p.photos[pi] || [];
  const card = document.createElement("article");
  card.className = file ? "card" : "card nophoto";
  card.style.cssText = tintVars(p.tint);
  card.innerHTML = `
    ${file
      ? `<div class="wash" style="background-image:url(photos/wash/${file}.jpg?v=${PHOTO_V})"></div>
    <div class="photo"><div class="kb"><img alt="${esc(p.name)}" decoding="async" draggable="false"></div></div>`
      : `<div class="wash"></div><div class="initial" aria-hidden="true">${esc(p.mark || p.name.split(" ").map(w => w[0]).join(""))}</div>`}
    <div class="top-shade"></div>
    <div class="copy">
      <div>${q.roman ? "" : '<span class="qmark" aria-hidden="true">“</span>'}
        <blockquote class="${quoteClass(q, lang)}" lang="${lang}">${esc(q.t).replace(/\n/g, "<br>")}</blockquote></div>
      <p class="ko" lang="ko">${esc(q.ko)}</p>
      <div class="byline"><div class="who"><span class="name">${esc(p.name)}</span><span class="role">${esc(p.ko)} · ${esc(q.w || p.role)}</span></div>
        <button class="more glass" type="button" data-story>${p.kind === "text" ? "배경" : "이야기"} ${CHEVRON_UP}</button></div>
    </div>`;
  card._qi = qi; card._pi = pi; card._focus = focus;
  const img = card.querySelector("img");
  if (!img) { card._ready = Promise.resolve(); return card; }
  card._ready = new Promise(res => {
    img.onload = () => { place(card); res(); };
    img.onerror = () => { img.remove(); res(); };
    img.src = `photos/${file}.jpg?v=${PHOTO_V}`;
    if (img.complete && img.naturalWidth) { place(card); res(); }
  });
  return card;
}

function place(card) {
  const img = card.querySelector("img");
  if (!img || !img.naturalWidth) return;
  // The photo covers the full width and at least the top 70% of the screen;
  // below that it fades into its own blurred wash, where the words sit.
  const cw = stage.clientWidth, ch = stage.clientHeight, H = 0.70;
  const [fx, fy] = card._focus;
  const s = Math.max(cw / img.naturalWidth, (ch * H) / img.naturalHeight) * 1.03;
  const w = img.naturalWidth * s, h = img.naturalHeight * s;
  const x = Math.min(0, Math.max(cw - w, cw / 2 - fx * w));
  const y = Math.min(0, Math.max(ch * H - h, ch * 0.30 - fy * h));
  img.style.width = w + "px";
  img.style.height = h + "px";
  img.style.transform = `translate3d(${x}px, ${y}px, 0)`;
  card.querySelector(".kb").style.transformOrigin = `${x + fx * w}px ${y + fy * h}px`;
}

/* ── deck order: shuffle bag, no repeats until everyone is seen ── */
let bag = [];
const history = [];   // [{ id, qi, pi }] — every card seen this session, in order
let pos = -1;
let current = null;

function roster() {
  const list = PEOPLE.map(p => p.id);
  if (myStart()) list.push("you");
  return list;
}
function refill() {
  const a = roster();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  const last = history.length ? history[history.length - 1].id : null;
  if (a.length > 1 && a[a.length - 1] === last) [a[0], a[a.length - 1]] = [a[a.length - 1], a[0]];
  bag = a;
}
function draw() {
  if (!bag.length) refill();
  return bag.pop();
}
function peek(dir) {
  if (dir > 0) {
    if (pos >= history.length - 1) history.push({ id: draw() });
    return history[pos + 1];
  }
  return pos > 0 ? history[pos - 1] : null;
}
function preloadAhead() {
  const p = BY_ID[peek(1).id];
  if (p) p.photos.forEach(([f]) => { const im = new Image(); im.src = `photos/${f}.jpg?v=${PHOTO_V}`; });
}

/* ── carousel ────────────────────────────── */
let cur = null;        // the card on screen
let neighbor = null;   // { dir, el, id } — the card being dragged in
let busy = false;
const W = () => stage.clientWidth;

function mount(entry) {
  const el = buildCard(entry.id, entry);
  if (entry.qi == null) { entry.qi = el._qi; entry.pi = el._pi; }   // pin the first pick
  el.dataset.id = entry.id;
  deck.appendChild(el);
  return el;
}
function setCurrent(el, id) {
  cur = el; current = id;
  el.classList.add("live");
  if (id !== "you") remember(id, el._qi, el._pi);
  applyTint(id === "you" ? YOU_TINT : BY_ID[id].tint);
}
function ensureNeighbor(dir) {
  if (neighbor && neighbor.dir === dir) return neighbor;
  dropNeighbor();
  const entry = peek(dir);
  if (!entry) return null;
  const el = mount(entry);
  el.style.transform = `translate3d(${dir * W()}px, 0, 0)`;
  neighbor = { dir, el, id: entry.id };
  return neighbor;
}
function dropNeighbor() { if (neighbor) { neighbor.el.remove(); neighbor = null; } }
function setOffset(dx) {
  cur.style.transform = `translate3d(${dx}px, 0, 0)`;
  if (neighbor) neighbor.el.style.transform = `translate3d(${neighbor.dir * W() + dx}px, 0, 0)`;
}

function settle(commit, ms = 340) {
  commit = commit && !!neighbor;
  busy = true;
  const els = [cur, neighbor && neighbor.el].filter(Boolean);
  els.forEach(el => { el.style.transition = `transform ${ms}ms cubic-bezier(.2, .8, .2, 1)`; void el.offsetWidth; });
  setOffset(commit ? -neighbor.dir * W() : 0);
  setTimeout(() => {
    els.forEach(el => { el.style.transition = ""; });
    if (commit) {
      const n = neighbor;
      neighbor = null;
      cur.remove();
      n.el.style.transform = "";
      pos += n.dir;
      setCurrent(n.el, n.id);
      preloadAhead();
      dismissHint();
    } else {
      dropNeighbor();
      cur.style.transform = "";
    }
    busy = false;
  }, ms + 20);
}

function go(dir) {
  if (busy || openSheet) return;
  if (!ensureNeighbor(dir)) return;
  settle(true, 420);
}

function start() {
  history.push({ id: draw() });
  pos = 0;
  const el = mount(history[0]);
  el.classList.add("enter");
  setCurrent(el, history[0].id);
  preloadAhead();
}

/* ── hint (first run only) ───────────────── */
const HINT_KEY = "aa.seenSwipeHint";
let hintTimer;
function showHint() {
  if (store.get(HINT_KEY)) return;
  $("hint").classList.remove("gone");
  hintTimer = setTimeout(dismissHint, 6000);
}
function dismissHint() {
  clearTimeout(hintTimer);
  if ($("hint").classList.contains("gone")) return;
  $("hint").classList.add("gone");
  store.set(HINT_KEY, "1");
}

/* ── sheets ──────────────────────────────── */
let openSheet = null;
function open(sheet) {
  if (openSheet) close();
  openSheet = sheet;
  sheet.inert = false;
  sheet.scrollTop = 0;
  sheet.classList.add("open");
  $("scrim").classList.add("open");
  dismissHint();
}
function close() {
  if (!openSheet) return;
  openSheet.classList.remove("open");
  openSheet.inert = true;
  $("scrim").classList.remove("open");
  openSheet = null;
  if (current) applyTint(current === "you" ? YOU_TINT : BY_ID[current].tint);
  stage.focus({ preventScroll: true });
}

function quoteText(q, lang) {
  if (q.roman) return q.t;
  const t = q.t.replace(/\n/g, "");
  return lang === "ja" ? `「${t}」` : `“${t}”`;
}

function openStory() {
  if (current === "you") return openMine();
  const p = BY_ID[current];
  if (!p || !cur) return;
  const lang = p.lang || "en", isText = p.kind === "text";
  $("s-name").textContent = p.name;
  $("s-sub").textContent = `${p.ko} · ${p.role}`;
  $("s-facts").hidden = isText;
  $("s-h").textContent = isText ? "술에 대한 글귀" : "이 사람이 한 말";
  if (!isText) {
    const s = parseSince(p.since), end = p.died ? parseSince(p.died).date : new Date(), e = elapsed(s.date, end);
    $("s-since").textContent = sinceShort(s, p.approx);
    if (p.died) { $("s-count-label").textContent = `${end.getFullYear()}년 별세까지`; $("s-count").textContent = (p.approx ? "약 " : "") + e.years + "년"; }
    else if (s.prec === "year") { $("s-count-label").textContent = "지난 해"; $("s-count").textContent = (p.approx ? "약 " : "") + e.years + "년"; }
    else { $("s-count-label").textContent = "지난 날"; $("s-count").textContent = (s.prec === "month" ? "약 " : "") + e.days.toLocaleString("ko-KR") + "일"; }
  }
  $("s-story").textContent = p.story;
  const order = [cur._qi, ...p.quotes.map((_, i) => i).filter(i => i !== cur._qi)];
  $("s-quotes").innerHTML = order.map((i, k) => {
    const q = p.quotes[i];
    return `<figure class="orig${k === 0 ? " now" : ""}">
      <blockquote lang="${lang}">${esc(quoteText(q, lang))}</blockquote>
      <p lang="ko">${esc(q.ko)}</p>
      <figcaption>${q.w ? esc(q.w) + "<br>" : ""}${esc(q.s[0])} · <a href="${esc(q.s[1])}" target="_blank" rel="noopener">원문</a></figcaption>
    </figure>`;
  }).join("");
  const file = (p.photos[cur._pi] || [])[0], cr = file && CREDITS[file];
  $("s-credit").innerHTML = cr
    ? `사진 · ${esc(cr[0])} · ${esc(cr[1])} · <a href="https://commons.wikimedia.org/wiki/${cr[2]}" target="_blank" rel="noopener">Wikimedia Commons</a>`
    : isText ? "" : "자유롭게 쓸 수 있는 사진이 없어 색으로만 보여줘요.";
  open($("story"));
}

function openMine() {
  const input = $("my-start");
  const t = new Date(), today = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
  input.max = today;
  input.value = myStart() || today;
  $("my-clear").hidden = !myStart();
  if (current !== "you" && !myStart()) applyTint(YOU_TINT);
  open($("mine"));
}

$("my-save").addEventListener("click", () => {
  const v = $("my-start").value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
  store.set(MY_KEY, v);
  renderMe();
  if (!bag.includes("you")) bag.splice(Math.floor(Math.random() * (bag.length + 1)), 0, "you");
  close();
  if (current === "you") {            // redraw my own card in place
    const el = mount({ id: "you" });
    cur.remove();
    setCurrent(el, "you");
    return;
  }
  dropNeighbor();
  history.splice(pos + 1, 0, { id: "you" });
  setTimeout(() => go(1), 60);
});
$("my-clear").addEventListener("click", () => {
  store.set(MY_KEY, null);
  bag = bag.filter(id => id !== "you");
  renderMe();
  close();
  dropNeighbor();
  // take my card out of the history so swiping back never lands on it
  for (let i = history.length - 1; i >= 0; i--) {
    if (history[i].id === "you" && i !== pos) { history.splice(i, 1); if (i < pos) pos--; }
  }
  if (current === "you") { history.splice(pos + 1, 0, { id: draw() }); go(1); setTimeout(() => { history.splice(pos - 1, 1); pos--; }, 500); }
});

document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
$("scrim").addEventListener("click", close);
$("me").addEventListener("click", openMine);

// swipe down on a sheet (at its top) closes it
document.querySelectorAll(".sheet").forEach(sh => {
  let y0 = null;
  sh.addEventListener("touchstart", e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  sh.addEventListener("touchend", e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 70) close(); y0 = null; });
});

/* ── stage gestures: drag sideways to change person, drag up for the story; taps do nothing ── */
let drag = null;
stage.addEventListener("pointerdown", e => {
  if (busy || openSheet || e.button > 0 || e.target.closest("button, a, input")) return;
  const now = performance.now();
  drag = { x0: e.clientX, y0: e.clientY, dx: 0, dy: 0, axis: null, lastX: e.clientX, lastT: now, vx: 0 };
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
});
stage.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.axis) {
    if (Math.hypot(dx, dy) < 8) return;
    drag.axis = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
    if (drag.axis === "x") stage.classList.add("dragging");
  }
  if (drag.axis === "y") { drag.dy = dy; return; }
  const now = performance.now();
  drag.vx = (e.clientX - drag.lastX) / Math.max(1, now - drag.lastT);
  drag.lastX = e.clientX; drag.lastT = now;
  const n = ensureNeighbor(dx < 0 ? 1 : -1);
  drag.dx = n ? dx : dx * 0.25;       // rubber band before the first card
  setOffset(drag.dx);
});
function endDrag() {
  if (!drag) return;
  const d = drag;
  drag = null;
  stage.classList.remove("dragging");
  if (d.axis === "y") { if (d.dy < -50) openStory(); return; }
  if (d.axis !== "x") return;         // a plain tap: stay on this person
  const dir = neighbor ? neighbor.dir : 0;
  const far = Math.abs(d.dx) > W() * 0.22;
  const flick = Math.abs(d.dx) > 40 && Math.abs(d.vx) > 0.5 && Math.sign(d.vx) === -dir;
  settle(dir !== 0 && Math.sign(d.dx) === -dir && (far || flick));
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", () => { if (drag) { drag = null; stage.classList.remove("dragging"); settle(false); } });
stage.addEventListener("click", e => {
  if (e.target.closest("[data-story]")) openStory();
  else if (e.target.closest("[data-mine]")) openMine();
});
stage.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { close(); return; }
  if (openSheet || e.target.closest("input, button, a")) return;
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "ArrowUp") { e.preventDefault(); openStory(); }
});

let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => deck.querySelectorAll(".card").forEach(place), 80); });
/* ── updates ─────────────────────────────── */
// The home-screen app often resumes instead of reloading, so when it comes back
// into view it asks the server for the current version and offers a one-tap update.
const APP_VERSION = "2026-09-30.7";
let newVersion = null;
async function checkForUpdate() {
  if (location.protocol !== "https:" && location.hostname !== "localhost") return;
  try {
    const html = await (await fetch(`index.html?fresh=${Date.now()}`, { cache: "no-store" })).text();
    const m = html.match(/const APP_VERSION = "([^"]+)"/);
    if (m && m[1] !== APP_VERSION) { newVersion = m[1]; $("update").hidden = false; }
  } catch (e) {}
  if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(() => {});
}
$("update").addEventListener("click", () => location.replace(`./?v=${encodeURIComponent(newVersion || Date.now())}`));
// tidy the address after an update (window.history: `history` in this script is the deck's own list)
if (location.search) window.history.replaceState(null, "", location.pathname);

document.addEventListener("visibilitychange", () => { if (!document.hidden) { renderMe(); checkForUpdate(); } });

/* ── go ──────────────────────────────────── */
renderMe();
start();
showHint();
setTimeout(checkForUpdate, 3000);

// Offline cache for the home-screen app (skipped where there is no manifest)
if ("serviceWorker" in navigator && document.querySelector('link[rel="manifest"]')) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
