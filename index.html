<style>
/* Layout: one full-bleed B&W portrait per screen, copy anchored bottom-left like a magazine cover line. Tap = next person. */
:root {
  --void: #070706;                    /* outside the stage on wide screens */
  --ink: #0e0d0c;                     /* ground behind photos */
  --paper: #f2eee8;                   /* type on photo */
  --mist: rgba(242, 238, 232, .74);
  --faint: rgba(242, 238, 232, .46);
  --rule: rgba(242, 238, 232, .16);
  --bronze: #c9a068;                  /* sobriety-chip bronze, the only accent */
  --sheet: rgba(19, 18, 16, .95);
  --field: rgba(242, 238, 232, .07);

  --f-display: "Bodoni Moda", "Bodoni 72", Didot, Georgia, serif;
  --f-label: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
  --f-ko: "Noto Serif KR", "AppleMyungjo", "Nanum Myeongjo", serif;
  --f-ja: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Noto Serif KR", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;

  --gutter: 24px;
  color-scheme: dark;
}

html, body { height: 100%; background: var(--void); color: var(--paper); }
body {
  margin: 0; overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  -webkit-font-smoothing: antialiased;
  font-family: var(--f-body);
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--bronze); outline-offset: 3px; }

.app { position: fixed; inset: 0; display: flex; justify-content: center; background: var(--void); }
.stage {
  position: relative; width: 100%; height: 100%;
  max-width: 62vh; max-width: 60dvh;
  overflow: hidden; background: var(--ink);
  touch-action: none; cursor: pointer; outline: none;
}
@media (max-aspect-ratio: 3/4) { .stage { max-width: none; } }

/* ── cards ─────────────────────────────────── */
.deck { position: absolute; inset: 0; }
.card { position: absolute; inset: 0; opacity: 0; transition: opacity .75s ease; }
.card.in { opacity: 1; }
.photo { position: absolute; inset: 0; overflow: hidden; }
.kb { position: absolute; inset: 0; animation: kb 16s cubic-bezier(.2, .6, .3, 1) both; }
.photo img {
  position: absolute; left: 0; top: 0; max-width: none; user-select: none; -webkit-user-drag: none;
  -webkit-mask-image: linear-gradient(180deg, #000 72%, transparent 100%);
  mask-image: linear-gradient(180deg, #000 72%, transparent 100%);
}
@keyframes kb { from { transform: scale(1.075); } to { transform: scale(1); } }

.shade {
  position: absolute; inset: 0;
  background: linear-gradient(180deg,
    rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 17%,
    rgba(0,0,0,0) 38%, rgba(0,0,0,.50) 56%,
    rgba(0,0,0,.88) 76%, rgba(0,0,0,.95) 100%);
}
.you .photo {
  background:
    radial-gradient(90% 60% at 50% 34%, #23201c 0%, #121110 55%, #0a0908 100%);
}
.you .chip { position: absolute; left: 50%; top: 34%; width: 62%; max-width: 300px; transform: translate(-50%, -50%); color: var(--bronze); opacity: .5; }

.copy {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 0 var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 28px);
  display: flex; flex-direction: column; gap: 14px;
}
.copy > * { opacity: 0; transform: translateY(12px); transition: opacity .6s ease, transform .9s cubic-bezier(.2, .7, .2, 1); }
.card.in .copy > * { opacity: 1; transform: none; }
.card.in .copy > :nth-child(1) { transition-delay: .12s; }
.card.in .copy > :nth-child(2) { transition-delay: .22s; }
.card.in .copy > :nth-child(3) { transition-delay: .30s; }
.card.in .copy > :nth-child(4) { transition-delay: .38s; }

.tally { display: flex; align-items: flex-end; gap: 14px; }
.num {
  font-family: var(--f-display); font-weight: 500;
  font-size: clamp(78px, 25vw, 108px); line-height: .74; letter-spacing: -.025em;
  font-variation-settings: "opsz" 96; font-variant-numeric: lining-nums;
}
.unit { display: flex; flex-direction: column; gap: 7px; padding-bottom: 3px; min-width: 0; }
.unit b { font: 600 11px/1 var(--f-label); font-stretch: 125%; letter-spacing: .22em; color: var(--bronze); }
.unit span { font: 500 10.5px/1 var(--f-label); font-stretch: 100%; letter-spacing: .16em; color: var(--faint); font-variant-numeric: tabular-nums; }

.quote {
  margin: 8px 0 0; font-family: var(--f-display); font-style: italic; font-weight: 400;
  font-size: 29px; line-height: 1.13; letter-spacing: -.005em;
  font-variation-settings: "opsz" 36; text-wrap: balance;
}
.quote.l { font-size: 25px; }
.quote.xl { font-size: 22px; line-height: 1.17; }
.quote.roman { font-style: normal; font-size: 64px; letter-spacing: .06em; line-height: 1; font-variation-settings: "opsz" 96; }
.quote:lang(ja) { font-family: var(--f-ja); font-style: normal; font-weight: 500; font-size: 26px; letter-spacing: .06em; line-height: 1.4; }
.ko { margin: 0; font: 400 15px/1.62 var(--f-ko); color: var(--mist); word-break: keep-all; text-wrap: pretty; max-width: 34em; }

.byline { display: flex; align-items: center; gap: 12px; margin-top: 4px; padding-top: 14px; border-top: 1px solid var(--rule); }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.name { font: 600 12px/1.25 var(--f-label); font-stretch: 125%; letter-spacing: .2em; text-transform: uppercase; }
.role { font: 400 12.5px/1.35 var(--f-body); color: var(--faint); word-break: keep-all; }
.more {
  display: inline-flex; align-items: center; gap: 6px; flex: none;
  font: 500 12px/1 var(--f-body); color: var(--mist);
  padding: 9px 12px; margin: -9px -12px -9px 0; border-radius: 999px;
}
.more svg { width: 11px; height: 11px; }
.more:active { background: var(--field); }

/* ── chrome ────────────────────────────────── */
.grain {
  position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  opacity: .16; mix-blend-mode: overlay;
}
.top {
  position: absolute; left: 0; right: 0; top: 0; z-index: 3;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) var(--gutter) 0;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none; filter: drop-shadow(0 1px 10px rgba(0,0,0,.45));
}
.top > * { pointer-events: auto; }
.mark { display: flex; align-items: center; gap: 9px; font: 700 12px/1 var(--f-label); font-stretch: 125%; letter-spacing: .34em; }
.mark svg { width: 20px; height: 20px; color: var(--bronze); }
.me {
  display: inline-flex; align-items: center; gap: 8px;
  font: 600 11px/1 var(--f-label); font-stretch: 112%; letter-spacing: .16em;
  padding: 9px 13px; border-radius: 999px;
  background: rgba(0,0,0,.30); border: 1px solid rgba(242,238,232,.26);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}
.me i { font-style: normal; color: var(--bronze); }
.me.unset { color: var(--mist); font: 500 12px/1 var(--f-body); letter-spacing: 0; }

.hint {
  position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 3;
  display: flex; justify-content: center; pointer-events: none;
  transition: opacity .6s ease;
}
.hint span {
  font: 500 12px/1 var(--f-body); color: var(--mist);
  padding: 9px 14px; border-radius: 999px; background: rgba(0,0,0,.35);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.hint.gone { opacity: 0; }

/* ── sheets ────────────────────────────────── */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 50%; bottom: 0; z-index: 11; box-sizing: border-box;
  width: 100%; max-width: 62vh; max-width: 60dvh; max-height: 84%;
  transform: translate(-50%, 104%); transition: transform .5s cubic-bezier(.2, .8, .2, 1);
  background: var(--sheet); -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px);
  border-radius: 22px 22px 0 0; box-shadow: 0 -20px 60px rgba(0,0,0,.5);
  overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  padding: 10px var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 30px);
  user-select: text; -webkit-user-select: text; cursor: auto;
}
@media (max-aspect-ratio: 3/4) { .sheet { max-width: none; } }
.sheet.open { transform: translate(-50%, 0); }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--rule); margin: 0 auto 18px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.close { flex: none; white-space: nowrap; font: 500 14px/1 var(--f-body); color: var(--mist); padding: 10px; margin: -6px -10px 0 0; }

.s-name { margin: 0; font: italic 400 34px/1.05 var(--f-display); font-variation-settings: "opsz" 48; text-wrap: balance; }
.s-sub { margin: 8px 0 0; font: 400 14px/1.4 var(--f-body); color: var(--faint); }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; margin: 24px 0 0; background: var(--rule); border-block: 1px solid var(--rule); }
.facts div { background: var(--sheet); padding: 14px 0; }
.facts div + div { padding-left: 16px; }
.facts dt { font: 600 10px/1 var(--f-label); font-stretch: 125%; letter-spacing: .2em; color: var(--bronze); text-transform: uppercase; }
.facts dd { margin: 8px 0 0; font: 400 20px/1.1 var(--f-display); font-variant-numeric: lining-nums tabular-nums; }
.story { margin: 22px 0 0; font: 400 16px/1.78 var(--f-body); color: var(--paper); word-break: keep-all; }
.orig { margin: 24px 0 0; padding: 18px 0 0; border-top: 1px solid var(--rule); }
.orig blockquote { margin: 0; font: italic 400 19px/1.35 var(--f-display); font-variation-settings: "opsz" 24; }
.orig blockquote:lang(ja) { font: 500 18px/1.6 var(--f-ja); }
.orig figcaption { margin-top: 10px; font: 400 13px/1.5 var(--f-body); color: var(--faint); }
.orig a, .credit a { text-underline-offset: 3px; text-decoration-color: var(--faint); }
.credit { margin: 22px 0 0; font: 400 12px/1.6 var(--f-body); color: var(--faint); word-break: break-word; }

.me-sheet h2 { margin: 0; font: 600 24px/1.2 var(--f-ko); }
.me-sheet p { margin: 10px 0 0; font: 400 15px/1.65 var(--f-body); color: var(--mist); word-break: keep-all; }
.me-sheet label { display: block; margin: 24px 0 8px; font: 600 10px/1 var(--f-label); font-stretch: 125%; letter-spacing: .2em; color: var(--bronze); }
.me-sheet input {
  display: block; width: 100%; box-sizing: border-box; min-height: 52px;
  font: 400 17px/1.2 var(--f-body); color: var(--paper);
  background: var(--field); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px;
  -webkit-appearance: none; appearance: none;
}
.row { display: flex; gap: 10px; margin-top: 16px; }
.btn { flex: 1; min-height: 50px; border-radius: 12px; font: 600 15px/1 var(--f-body); }
.btn.primary { background: var(--paper); color: var(--ink); }
.btn.ghost { border: 1px solid var(--rule); color: var(--mist); }
.btn:disabled { opacity: .35; cursor: default; }
.me-note { font-size: 13px !important; color: var(--faint) !important; }

@media (prefers-reduced-motion: reduce) {
  .kb { animation: none; }
  .card, .copy > *, .sheet, .scrim { transition-duration: .01s !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage" tabindex="0" aria-label="탭하면 다음 사람">
    <div class="deck" id="deck"></div>
    <div class="grain" aria-hidden="true"></div>

    <header class="top">
      <div class="mark" aria-label="AA">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="20" cy="20" r="18"/><path d="M20 6.5 L32 27.5 H8 Z"/></svg>
        AA
      </div>
      <button class="me unset" id="me" type="button">+ 나의 시작일</button>
    </header>

    <div class="hint gone" id="hint" aria-hidden="true"><span>탭하면 다음 사람 · 위로 쓸면 이야기</span></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="story" role="dialog" aria-modal="true" aria-labelledby="s-name" inert>
  <div class="grab"></div>
  <div class="sheet-head">
    <div>
      <h2 class="s-name" id="s-name"></h2>
      <p class="s-sub" id="s-sub"></p>
    </div>
    <button class="close" type="button" data-close>닫기</button>
  </div>
  <dl class="facts">
    <div><dt>Sober since</dt><dd id="s-since"></dd></div>
    <div><dt id="s-count-label">Days</dt><dd id="s-count"></dd></div>
  </dl>
  <p class="story" id="s-story"></p>
  <figure class="orig">
    <blockquote id="s-quote"></blockquote>
    <figcaption id="s-src"></figcaption>
  </figure>
  <p class="credit" id="s-credit"></p>
</section>

<section class="sheet me-sheet" id="mine" role="dialog" aria-modal="true" aria-labelledby="m-title" inert>
  <div class="grab"></div>
  <div class="sheet-head">
    <h2 id="m-title">나의 시작일</h2>
    <button class="close" type="button" data-close>닫기</button>
  </div>
  <p>마지막 잔을 내려놓은 다음 날을 넣어 두면, 오른쪽 위에 경과일이 뜨고 내 카드도 명단 사이에 섞여 나와요.</p>
  <label for="my-start">START DATE</label>
  <input type="date" id="my-start">
  <div class="row">
    <button class="btn ghost" type="button" id="my-clear">지우기</button>
    <button class="btn primary" type="button" id="my-save">저장</button>
  </div>
  <p class="me-note">이 기기의 브라우저에만 저장돼요.</p>
</section>

const BY_ID = Object.fromEntries(PEOPLE.map(p => [p.id, p]));
const CHIP = '<svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="100" cy="100" r="96"/><circle cx="100" cy="100" r="84"/><path d="M100 30 L160.6 135 H39.4 Z"/></svg>';

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function dayStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function parseSince(s) {
  const [y, m, d] = s.split("-").map(Number);
  const prec = d ? "day" : m ? "month" : "year";
  // 연도만 알면 7월 1일, 월까지만 알면 15일로 가정
  return { y, m, d, prec, date: new Date(y, (m || 7) - 1, d || (m ? 15 : 1)) };
}

function elapsed(from, to = new Date()) {
  const a = dayStart(from), b = dayStart(to);
  let years = b.getFullYear() - a.getFullYear();
  if (b.getMonth() < a.getMonth() || (b.getMonth() === a.getMonth() && b.getDate() < a.getDate())) years--;
  let months = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  if (b.getDate() < a.getDate()) months--;
  const days = Math.round((b - a) / 864e5);
  return { years: Math.max(0, years), months: Math.max(0, months), days: Math.max(0, days) };
}

function tally(e) {
  if (e.years >= 1) return [e.years, e.years === 1 ? "YEAR SOBER" : "YEARS SOBER"];
  if (e.months >= 1) return [e.months, e.months === 1 ? "MONTH SOBER" : "MONTHS SOBER"];
  return [e.days, e.days === 1 ? "DAY SOBER" : "DAYS SOBER"];
}

function sinceEn(s, approx) {
  if (s.prec === "day") return `SINCE ${s.d} ${MON[s.m - 1]} ${s.y}`;
  if (s.prec === "month") return `SINCE ${MON[s.m - 1]} ${s.y}`;
  return `SINCE ${approx ? "C. " : ""}${s.y}`;
}
function sinceKo(s, approx) {
  if (s.prec === "day") return `${s.y}. ${s.m}. ${s.d}`;
  if (s.prec === "month") return `${s.y}. ${s.m}`;
  return `${s.y}${approx ? "년 무렵" : "년"}`;
}

/* ── my own date ─────────────────────────── */
const MY_KEY = "aa.myStart";
function myStart() {
  const v = store.get(MY_KEY);
  return v && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null;
}
function myElapsed() {
  const v = myStart();
  if (!v) return null;
  return elapsed(parseSince(v).date);
}
function renderMe() {
  const btn = $("me"), e = myElapsed();
  if (!e) { btn.className = "me unset"; btn.textContent = "+ 나의 시작일"; return; }
  btn.className = "me";
  const label = e.days === 0 ? "TODAY" : e.days === 1 ? "1 DAY" : `${e.days.toLocaleString("en-US")} DAYS`;
  btn.innerHTML = `<i>YOU</i> ${label}`;
}

/* ── cards ───────────────────────────────── */
function quoteClass(p) {
  if (p.roman) return "quote roman";
  const n = p.quote.length;
  return n > 72 ? "quote xl" : n > 44 ? "quote l" : "quote";
}

function buildCard(id) {
  const card = document.createElement("article");
  card.className = "card";
  card.setAttribute("aria-live", "polite");

  if (id === "you") {
    const v = myStart(), s = parseSince(v), [n, unit] = tally(elapsed(s.date));
    card.classList.add("you");
    card.innerHTML = `
      <div class="photo"><div class="chip">${CHIP}</div></div>
      <div class="shade"></div>
      <div class="copy">
        <div class="tally"><span class="num">${n}</span><span class="unit"><b>${unit}</b><span>${sinceEn(s)}</span></span></div>
        <div class="byline"><div class="who"><span class="name">You</span><span class="role">나의 기록</span></div>
          <button class="more" type="button" data-mine>날짜 <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 8l4-4 4 4"/></svg></button></div>
      </div>`;
    card._ready = Promise.resolve();
    return card;
  }

  const p = BY_ID[id], s = parseSince(p.since), [n, unit] = tally(elapsed(s.date));
  const lang = p.lang || "en";
  card.innerHTML = `
    <div class="photo"><div class="kb"><img alt="${esc(p.name)}" decoding="async"></div></div>
    <div class="shade"></div>
    <div class="copy">
      <div class="tally"><span class="num">${n}</span><span class="unit"><b>${unit}</b><span>${sinceEn(s, p.approx)}</span></span></div>
      <blockquote class="${quoteClass(p)}" lang="${lang}">${(p.roman || lang === "ja" ? esc(p.quote) : "“" + esc(p.quote) + "”").replace(/\n/g, "<br>")}</blockquote>
      <p class="ko" lang="ko">${esc(p.line)}</p>
      <div class="byline"><div class="who"><span class="name">${esc(p.name)}</span><span class="role">${esc(p.ko)} · ${esc(p.role)}</span></div>
        <button class="more" type="button" data-story>이야기 <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 8l4-4 4 4"/></svg></button></div>
    </div>`;
  card._focus = p.focus;
  const img = card.querySelector("img");
  card._ready = new Promise(res => {
    img.onload = () => { place(card); res(); };
    img.onerror = () => { img.remove(); res(); };
    img.src = `photos/${id}.jpg`;
    if (img.complete && img.naturalWidth) { place(card); res(); }
  });
  return card;
}

function place(card) {
  const img = card.querySelector("img");
  if (!img || !img.naturalWidth) return;
  // The photo covers the full width and at least the top 74% of the screen;
  // below that it fades into black where the text sits.
  const cw = stage.clientWidth, ch = stage.clientHeight, H = 0.74;
  const [fx, fy] = card._focus;
  const s = Math.max(cw / img.naturalWidth, (ch * H) / img.naturalHeight) * 1.03;
  const w = img.naturalWidth * s, h = img.naturalHeight * s;
  const x = Math.min(0, Math.max(cw - w, cw / 2 - fx * w));
  const y = Math.min(0, Math.max(ch * H - h, ch * 0.33 - fy * h));
  img.style.width = w + "px";
  img.style.height = h + "px";
  img.style.transform = `translate3d(${x}px, ${y}px, 0)`;
  card.querySelector(".kb").style.transformOrigin = `${x + fx * w}px ${y + fy * h}px`;
}

let current = null;
function show(id) {
  const card = buildCard(id);
  card.dataset.id = id;
  deck.appendChild(card);
  current = id;
  const reveal = () => {
    if (!card.isConnected) return;
    void card.offsetWidth; // commit the hidden state so the fade runs
    card.classList.add("in");
    setTimeout(() => {
      [...deck.children].forEach(c => { if (c !== card && c.compareDocumentPosition(card) & Node.DOCUMENT_POSITION_FOLLOWING) c.remove(); });
    }, 900);
  };
  Promise.race([card._ready, new Promise(r => setTimeout(r, 900))]).then(reveal);
}

/* ── deck order: shuffle bag, no repeats until everyone is seen ── */
let bag = [];
const history = [];
let pos = -1;

function roster() {
  const list = PEOPLE.map(p => p.id);
  if (myStart()) list.push("you");
  return list;
}
function refill() {
  const a = roster();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  const last = history[history.length - 1];
  if (a.length > 1 && a[a.length - 1] === last) [a[0], a[a.length - 1]] = [a[a.length - 1], a[0]];
  bag = a;
}
function draw() {
  if (!bag.length) refill();
  return bag.pop();
}
function preloadAhead() {
  if (bag.length < 2) {
    const rest = bag.slice();
    refill();
    bag = bag.filter(id => !rest.includes(id)).concat(rest);
  }
  bag.slice(-2).forEach(id => { if (id !== "you") { const im = new Image(); im.src = `photos/${id}.jpg`; } });
}

function next() {
  if (pos < history.length - 1) pos++;
  else { history.push(draw()); pos = history.length - 1; }
  show(history[pos]);
  preloadAhead();
  dismissHint();
}
function prev() {
  if (pos <= 0) return;
  pos--;
  show(history[pos]);
}

/* ── hint (first run only) ───────────────── */
const HINT_KEY = "aa.seenHint";
let hintTimer;
function showHint() {
  if (store.get(HINT_KEY)) return;
  $("hint").classList.remove("gone");
  hintTimer = setTimeout(dismissHint, 5000);
}
function dismissHint() {
  clearTimeout(hintTimer);
  if ($("hint").classList.contains("gone")) return;
  $("hint").classList.add("gone");
  store.set(HINT_KEY, "1");
}

/* ── sheets ──────────────────────────────── */
let openSheet = null;
function open(sheet) {
  if (openSheet) close();
  openSheet = sheet;
  sheet.inert = false;
  sheet.scrollTop = 0;
  sheet.classList.add("open");
  $("scrim").classList.add("open");
  dismissHint();
}
function close() {
  if (!openSheet) return;
  openSheet.classList.remove("open");
  openSheet.inert = true;
  $("scrim").classList.remove("open");
  openSheet = null;
  stage.focus({ preventScroll: true });
}

function openStory() {
  if (current === "you") return openMine();
  const p = BY_ID[current];
  if (!p) return;
  const s = parseSince(p.since), e = elapsed(s.date), cr = CREDITS[p.id];
  $("s-name").textContent = p.name;
  $("s-sub").textContent = `${p.ko} · ${p.role}`;
  $("s-since").textContent = sinceKo(s, p.approx);
  if (s.prec === "day") { $("s-count-label").textContent = "Days"; $("s-count").textContent = e.days.toLocaleString("ko-KR") + "일"; }
  else if (s.prec === "month") { $("s-count-label").textContent = "Days"; $("s-count").textContent = "약 " + e.days.toLocaleString("ko-KR") + "일"; }
  else { $("s-count-label").textContent = "Years"; $("s-count").textContent = (p.approx ? "약 " : "") + e.years + "년"; }
  $("s-story").textContent = p.story;
  const q = $("s-quote");
  q.lang = p.lang || "en";
  q.textContent = p.roman || p.lang === "ja" ? p.quote.replace(/\n/g, "") : `“${p.quote}”`;
  $("s-src").innerHTML = `${esc(p.src[0])} · <a href="${esc(p.src[1])}" target="_blank" rel="noopener">원문 기사</a>`;
  $("s-credit").innerHTML = cr
    ? `사진 · ${esc(cr[0])} · ${esc(cr[1])} · <a href="https://commons.wikimedia.org/wiki/${cr[2]}" target="_blank" rel="noopener">Wikimedia Commons</a>`
    : "";
  open($("story"));
}

function openMine() {
  const input = $("my-start");
  const t = new Date(), today = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
  input.max = today;
  input.value = myStart() || today;
  $("my-clear").disabled = !myStart();
  open($("mine"));
}

$("my-save").addEventListener("click", () => {
  const v = $("my-start").value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
  const had = !!myStart();
  store.set(MY_KEY, v);
  renderMe();
  if (!had && !bag.includes("you")) bag.splice(Math.floor(Math.random() * (bag.length + 1)), 0, "you");
  close();
  if (current === "you") show("you");
});
$("my-clear").addEventListener("click", () => {
  store.set(MY_KEY, null);
  bag = bag.filter(id => id !== "you");
  renderMe();
  close();
  if (current === "you") next();
});

document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
$("scrim").addEventListener("click", close);
$("me").addEventListener("click", openMine);

// swipe down on a sheet (at its top) closes it
document.querySelectorAll(".sheet").forEach(sh => {
  let y0 = null;
  sh.addEventListener("touchstart", e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  sh.addEventListener("touchend", e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 70) close(); y0 = null; });
});

/* ── stage gestures ──────────────────────── */
let start = null;
stage.addEventListener("pointerdown", e => {
  if (e.target.closest("button, a, input")) { start = null; return; }
  start = { x: e.clientX, y: e.clientY };
});
stage.addEventListener("pointerup", e => {
  if (!start) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  start = null;
  if (Math.abs(dy) > 48 && Math.abs(dy) > Math.abs(dx)) { if (dy < 0) openStory(); return; }
  if (Math.abs(dx) > 48) { dx < 0 ? next() : prev(); return; }
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) next();
});
stage.addEventListener("pointercancel", () => { start = null; });
stage.addEventListener("click", e => {
  if (e.target.closest("[data-story]")) openStory();
  else if (e.target.closest("[data-mine]")) openMine();
});
stage.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { close(); return; }
  if (openSheet || e.target.closest("input, button, a")) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft") prev();
  else if (e.key === "ArrowUp") { e.preventDefault(); openStory(); }
});

let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => deck.querySelectorAll(".card").forEach(place), 80); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) renderMe(); });

/* ── go ──────────────────────────────────── */
renderMe();
next();
showHint();

// Offline cache for the home-screen app (skipped where there is no manifest, e.g. the Claude artifact copy)
if ("serviceWorker" in navigator && document.querySelector('link[rel="manifest"]')) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
