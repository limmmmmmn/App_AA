<style>
/* Layout: a color portrait over a blurred wash of itself (like Apple Music's Now Playing).
   iOS system type and controls; every person carries one system tint that recolors the UI. */
:root {
  --black: #000;
  --label: #fff;
  --label-2: rgba(235, 235, 245, .64);
  --label-3: rgba(235, 235, 245, .34);
  --fill: rgba(118, 118, 128, .30);
  --fill-2: rgba(118, 118, 128, .18);
  --sep: rgba(255, 255, 255, .16);
  --sheet: rgba(24, 24, 26, .84);
  --destructive: #ff453a;
  --tint: #ff375f;          /* replaced per person */
  --on-tint: #fff;
  --tint-text: color-mix(in oklab, var(--tint) 72%, white);

  --f-display: -apple-system, "SF Pro Display", BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
  --f-text: -apple-system, "SF Pro Text", BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
  --f-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  --f-ja: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;

  --gutter: 20px;
  color-scheme: dark;
}

html, body { height: 100%; background: var(--black); color: var(--label); }
body {
  margin: 0; overflow: hidden; overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  -webkit-font-smoothing: antialiased;
  font-family: var(--f-text);
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: var(--tint-text); text-decoration: none; }
:focus-visible { outline: 2px solid var(--tint-text); outline-offset: 3px; }

.glass {
  background: rgba(255, 255, 255, .14);
  -webkit-backdrop-filter: blur(22px) saturate(1.8); backdrop-filter: blur(22px) saturate(1.8);
  box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .22);
}

.app { position: fixed; inset: 0; display: flex; justify-content: center; background: var(--black); }
.stage {
  position: relative; width: 100%; height: 100%;
  max-width: 62vh; max-width: 60dvh;
  overflow: hidden; background: var(--black);
  touch-action: none; cursor: pointer; outline: none;
}
@media (max-aspect-ratio: 3/4) { .stage { max-width: none; } }

/* ── cards ─────────────────────────────────── */
.deck { position: absolute; inset: 0; }
.card { position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease; }
.card.in { opacity: 1; }

.wash {
  position: absolute; inset: -12%;
  background-size: cover; background-position: center;
  filter: blur(18px) saturate(1.25);
}
.wash::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.25) 55%, rgba(0,0,0,.55) 100%);
}
.photo { position: absolute; inset: 0; overflow: hidden; }
.kb { position: absolute; inset: 0; animation: kb 16s cubic-bezier(.2, .6, .3, 1) both; }
@keyframes kb { from { transform: scale(1.07); } to { transform: scale(1); } }
.photo img {
  position: absolute; left: 0; top: 0; max-width: none; user-select: none; -webkit-user-drag: none;
  -webkit-mask-image: linear-gradient(180deg, #000 66%, transparent 98%);
  mask-image: linear-gradient(180deg, #000 66%, transparent 98%);
}
.top-shade { position: absolute; left: 0; right: 0; top: 0; height: 140px; background: linear-gradient(180deg, rgba(0,0,0,.42), rgba(0,0,0,0)); pointer-events: none; }

.copy {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 0 var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 22px);
  display: flex; flex-direction: column; gap: 10px;
}
.copy > * { opacity: 0; transform: translateY(14px); transition: opacity .55s ease, transform .8s cubic-bezier(.2, .8, .2, 1); }
.card.in .copy > * { opacity: 1; transform: none; }
.card.in .copy > :nth-child(1) { transition-delay: .10s; }
.card.in .copy > :nth-child(2) { transition-delay: .16s; }
.card.in .copy > :nth-child(3) { transition-delay: .24s; }
.card.in .copy > :nth-child(4) { transition-delay: .30s; }
.card.in .copy > :nth-child(5) { transition-delay: .36s; }

.tally { display: flex; align-items: baseline; gap: 4px; }
.num {
  font: 800 clamp(84px, 26vw, 112px)/.92 var(--f-round); letter-spacing: -.045em;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #fff 35%, color-mix(in oklab, var(--tint) 60%, white));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  padding-right: .04em;
}
.unit { font: 700 34px/1 var(--f-round); letter-spacing: -.02em; color: var(--tint-text); }
.since { margin-top: -2px; font: 600 15px/1.3 var(--f-text); letter-spacing: -.01em; color: var(--label-2); }

.quote { margin: 8px 0 0; font: 600 25px/1.2 var(--f-display); letter-spacing: -.022em; text-wrap: balance; }
.quote.l { font-size: 22px; }
.quote.xl { font-size: 19.5px; line-height: 1.26; }
.quote.roman { font: 800 58px/1 var(--f-round); letter-spacing: .01em; }
.quote:lang(ja) { font-family: var(--f-ja); font-weight: 700; font-size: 25px; line-height: 1.4; letter-spacing: .02em; }
.ko { margin: 0; font: 400 16px/1.5 var(--f-text); letter-spacing: -.01em; color: var(--label-2); word-break: keep-all; text-wrap: pretty; }

.byline { display: flex; align-items: center; gap: 12px; margin-top: 6px; padding-top: 14px; border-top: .5px solid var(--sep); }
.who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.name { font: 600 17px/1.25 var(--f-text); letter-spacing: -.02em; }
.role { font: 400 13px/1.35 var(--f-text); color: var(--label-2); word-break: keep-all; }
.more {
  flex: none; display: inline-flex; align-items: center; gap: 5px;
  padding: 9px 14px; border-radius: 999px; font: 600 15px/1 var(--f-text); letter-spacing: -.01em;
}
.more svg { width: 12px; height: 12px; }
.more:active, .pill:active { transform: scale(.96); }

/* the viewer's own card */
.you .wash {
  inset: 0; filter: none;
  background:
    radial-gradient(60% 45% at 18% 18%, rgba(255, 55, 95, .70), transparent 70%),
    radial-gradient(55% 45% at 86% 30%, rgba(255, 159, 10, .55), transparent 70%),
    radial-gradient(70% 50% at 50% 78%, rgba(191, 90, 242, .50), transparent 70%),
    #0b0b0d;
}
.ring-wrap { position: absolute; left: 50%; top: 33%; width: 64%; max-width: 280px; aspect-ratio: 1; transform: translate(-50%, -50%); }
.ring { width: 100%; height: 100%; display: block; }
.ring .track { stroke: rgba(255, 255, 255, .14); }
.ring .bar { transition: stroke-dashoffset 1.4s cubic-bezier(.3, .7, .2, 1) .25s; }
.card.in .ring .bar { stroke-dashoffset: var(--off); }
.ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.ring-label span { font: 600 13px/1 var(--f-text); color: var(--label-2); }
.ring-label b { font: 800 44px/1 var(--f-round); letter-spacing: -.03em; }
.ring-label em { font: 600 13px/1 var(--f-text); font-style: normal; color: #ffb340; }

/* ── chrome ────────────────────────────────── */
.top {
  position: absolute; left: 0; right: 0; top: 0; z-index: 3;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) var(--gutter) 0;
  display: flex; justify-content: space-between; align-items: center;
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.mark { display: flex; align-items: center; gap: 7px; font: 700 19px/1 var(--f-round); letter-spacing: -.01em; }
.mark svg { width: 22px; height: 22px; }
.pill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 14px; border-radius: 999px;
  font: 600 14px/1 var(--f-text); letter-spacing: -.01em;
  transition: transform .15s ease;
}
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tint); box-shadow: 0 0 10px var(--tint); }
.pill.unset { color: var(--label-2); }

.hint {
  position: absolute; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 3;
  display: flex; justify-content: center; pointer-events: none; transition: opacity .6s ease;
}
.hint span { font: 500 13px/1 var(--f-text); padding: 10px 15px; border-radius: 999px; color: var(--label); }
.hint.gone { opacity: 0; }

/* ── sheets ────────────────────────────────── */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.38); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 50%; bottom: 0; z-index: 11; box-sizing: border-box;
  width: 100%; max-width: 62vh; max-width: 60dvh; max-height: 86%;
  transform: translate(-50%, 104%); transition: transform .5s cubic-bezier(.2, .85, .2, 1);
  background: var(--sheet);
  -webkit-backdrop-filter: blur(40px) saturate(1.8); backdrop-filter: blur(40px) saturate(1.8);
  border-radius: 30px 30px 0 0; box-shadow: 0 -10px 50px rgba(0,0,0,.45), inset 0 .5px 0 rgba(255,255,255,.12);
  overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  padding: 8px var(--gutter) calc(env(safe-area-inset-bottom, 0px) + 28px);
  user-select: text; -webkit-user-select: text; cursor: auto;
}
@media (max-aspect-ratio: 3/4) { .sheet { max-width: none; } }
.sheet.open { transform: translate(-50%, 0); }
.grab { width: 36px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.28); margin: 0 auto 14px; }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.x { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--fill); color: var(--label-2); display: grid; place-items: center; }
.x svg { width: 12px; height: 12px; }

.s-name { margin: 2px 0 0; font: 700 28px/1.15 var(--f-display); letter-spacing: -.025em; text-wrap: balance; }
.s-sub { margin: 6px 0 0; font: 400 15px/1.4 var(--f-text); color: var(--label-2); word-break: keep-all; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 22px 0 0; }
.facts div { background: var(--fill-2); border-radius: 18px; padding: 14px 16px; min-width: 0; }
.facts dt { font: 600 13px/1 var(--f-text); color: var(--label-2); }
.facts dd { margin: 9px 0 0; font: 700 22px/1.1 var(--f-round); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.facts div:last-child dd { color: var(--tint-text); }
.story { margin: 22px 0 0; font: 400 17px/1.62 var(--f-text); letter-spacing: -.012em; word-break: keep-all; }
.orig { margin: 22px 0 0; padding: 16px 18px; background: var(--fill-2); border-radius: 18px; }
.orig blockquote { margin: 0; font: 600 17px/1.4 var(--f-display); letter-spacing: -.015em; }
.orig blockquote:lang(ja) { font-family: var(--f-ja); }
.orig figcaption { margin-top: 8px; font: 400 13px/1.45 var(--f-text); color: var(--label-2); }
.credit { margin: 16px 4px 0; font: 400 12px/1.5 var(--f-text); color: var(--label-3); word-break: break-word; }
.credit a { color: var(--label-2); }

.me-sheet h2 { margin: 2px 0 0; font: 700 28px/1.15 var(--f-display); letter-spacing: -.025em; }
.me-sheet p { margin: 10px 0 0; font: 400 15px/1.55 var(--f-text); color: var(--label-2); word-break: keep-all; }
.field {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-top: 22px; min-height: 54px; padding: 0 16px; border-radius: 16px; background: var(--fill-2);
}
.field label { font: 400 17px/1 var(--f-text); }
.field input {
  flex: 1; min-width: 0; height: 54px; border: 0; background: transparent; text-align: right;
  font: 400 17px/1 var(--f-text); color: var(--tint-text);
  -webkit-appearance: none; appearance: none;
}
.field input::-webkit-date-and-time-value { text-align: right; }
.btn { display: block; width: 100%; min-height: 52px; border-radius: 999px; font: 600 17px/1 var(--f-text); letter-spacing: -.01em; }
.btn.primary { margin-top: 16px; background: var(--tint); color: var(--on-tint); }
.btn.plain { margin-top: 6px; color: var(--destructive); }
.btn:disabled { opacity: .3; cursor: default; }
.me-note { text-align: center; font-size: 13px !important; color: var(--label-3) !important; }

@media (prefers-reduced-motion: reduce) {
  .kb { animation: none; }
  .card, .copy > *, .sheet, .scrim, .ring .bar { transition-duration: .01s !important; transition-delay: 0s !important; }
}
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage" tabindex="0" aria-label="탭하면 다음 사람">
    <div class="deck" id="deck"></div>

      <div class="mark" aria-label="AA">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" aria-hidden="true"><circle cx="20" cy="20" r="17.5"/><path d="M20 8.5 L30.5 27 H9.5 Z"/></svg>
        AA
      </div>
      <button class="pill glass unset" id="me" type="button">+ 나의 시작일</button>

    <div class="hint gone" id="hint" aria-hidden="true"><span class="glass">탭하면 다음 사람 · 위로 쓸면 이야기</span></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<section class="sheet" id="story" role="dialog" aria-modal="true" aria-labelledby="s-name" inert>
  <div class="grab"></div>
  <div class="sheet-head">
    <div>
      <h2 class="s-name" id="s-name"></h2>
      <p class="s-sub" id="s-sub"></p>
    </div>
    <button class="x" type="button" data-close aria-label="닫기"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8"/></svg></button>
  </div>
  <dl class="facts">

  <figure class="orig">

</section>

<section class="sheet me-sheet" id="mine" role="dialog" aria-modal="true" aria-labelledby="m-title" inert>

  </div>
  <p>마지막 잔을 내려놓은 다음 날을 넣어 두면, 오른쪽 위에 지난 날이 뜨고 내 카드도 명단 사이에 섞여 나와요.</p>
  <div class="field">
    <label for="my-start">시작일</label>
    <input type="date" id="my-start">
  </div>
  <button class="btn primary" type="button" id="my-save">저장</button>
  <button class="btn plain" type="button" id="my-clear">기록 지우기</button>
  <p class="me-note">이 기기에만 저장돼요.</p>
</section>

  lowe: ["David Shankbone", "CC BY 3.0", "File:Rob_Lowe_2012_Shankbone_2.JPG"],
  eminem: ["Brendan Linden", "CC0", "File:Eminem_2021_Color_Corrected.jpg"],
  elton: ["Raph_PH", "CC BY 2.0", "File:EltonDocBFILFF101024_(4_of_17)_(cropped).jpg"],
  ringo: ["dearMoon", "CC BY 3.0", "File:ARTIST_INTERVIEW_-_Ringo_Starr_(Former_the_Beatles)_exclusive_interview_0-14_screenshot_(portrait_crop).jpg"],
  slash: ["Kreepin Deth", "CC BY-SA 4.0", "File:Slash_live_in_London_2022_(Cropped_-_upright).jpg"],
  alice: ["Stefan Brending (2eight)", "CC BY-SA 3.0 DE", "File:2024_Alice_Cooper_-_by_2eight_-_9SC8435.jpg"],
  florence: ["Raph_PH", "CC BY 2.0", "File:FlorenceRAHProms110924_(68_of_76)_(53989416201)_(cropped).jpg"],
  king: ["Kevin Payravi", "CC BY-SA 4.0", "File:Stephen_King_at_the_2024_Toronto_International_Film_Festival_2_(cropped).jpg"],
  matsushige: ["Dick Thomas Johnson", "CC BY 2.0", "File:Matsushige_Yutaka_from_%22The_Solitary_Gourmet%22_at_Red_Carpet_of_the_Tokyo_International_Film_Festival_2024_(54578101085).jpg"],
};

/* ──────────────────────────────────────────────────────────── */
const $ = (id) => document.getElementById(id);
const stage = $("stage"), deck = $("deck"), root = document.documentElement;
const BY_ID = Object.fromEntries(PEOPLE.map(p => [p.id, p]));
const YOU_TINT = "pink";
const PHOTO_V = "2";   // sw.js의 CACHE 버전과 맞춰서 올리기
const CHEVRON_UP = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8l4-4 4 4"/></svg>';

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
};

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function dayStart(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function tintVars(key) { const [c, on] = TINTS[key] || TINTS.pink; return `--tint:${c};--on-tint:${on}`; }
function applyTint(key) {
  const [c, on] = TINTS[key] || TINTS.pink;
  root.style.setProperty("--tint", c);
  root.style.setProperty("--on-tint", on);
}

function parseSince(s) {
  const [y, m, d] = s.split("-").map(Number);
  const prec = d ? "day" : m ? "month" : "year";
  // 연도만 알면 7월 1일, 월까지만 알면 15일로 가정
  return { y, m, d, prec, date: new Date(y, (m || 7) - 1, d || (m ? 15 : 1)) };
}

function elapsed(from, to = new Date()) {
  const a = dayStart(from), b = dayStart(to);
  let years = b.getFullYear() - a.getFullYear();
  if (b.getMonth() < a.getMonth() || (b.getMonth() === a.getMonth() && b.getDate() < a.getDate())) years--;
  let months = (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
  if (b.getDate() < a.getDate()) months--;
  const days = Math.round((b - a) / 864e5);
  return { years: Math.max(0, years), months: Math.max(0, months), days: Math.max(0, days) };
}

function tally(e) {
  if (e.years >= 1) return [e.years, "년"];
  if (e.months >= 1) return [e.months, "개월"];
  return [e.days, "일"];
}

function sinceLong(s, approx) {
  if (s.prec === "day") return `${s.y}년 ${s.m}월 ${s.d}일부터 금주 중`;
  if (s.prec === "month") return `${s.y}년 ${s.m}월부터 금주 중`;
  return `${s.y}년${approx ? " 무렵" : ""}부터 금주 중`;
}
function sinceShort(s, approx) {
  if (s.prec === "day") return `${s.y}. ${s.m}. ${s.d}`;
  if (s.prec === "month") return `${s.y}. ${s.m}`;
  return `${s.y}${approx ? " 무렵" : ""}`;
}

/* ── my own date ─────────────────────────── */
const MY_KEY = "aa.myStart";
function myStart() {
  const v = store.get(MY_KEY);
  return v && /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null;
}
function myDays() {
  const v = myStart();
  return v ? elapsed(parseSince(v).date).days : null;
}
function renderMe() {
  const btn = $("me"), d = myDays();
  if (d == null) { btn.className = "pill glass unset"; btn.textContent = "+ 나의 시작일"; return; }
  btn.className = "pill glass";
  btn.innerHTML = `<span class="dot"></span>나 · ${d === 0 ? "오늘 시작" : d.toLocaleString("ko-KR") + "일"}`;
}

// 다음 목표: 1, 3, 7, 14, 30, 60, 90, 100, 180일, 그 뒤로 1년 단위
function milestone(d) {
  const steps = [1, 3, 7, 14, 30, 60, 90, 100, 180, 365];
  let prev = 0;
  for (const m of steps) { if (d < m) return { prev, next: m }; prev = m; }
  const y = Math.floor(d / 365);
  return { prev: y * 365, next: (y + 1) * 365 };
}
function dayLabel(n) { return n >= 365 && n % 365 === 0 ? `${n / 365}년` : `${n.toLocaleString("ko-KR")}일`; }

/* ── cards ───────────────────────────────── */
function quoteClass(p) {
  if (p.roman) return "quote roman";
  const n = p.quote.length;
  return n > 72 ? "quote xl" : n > 44 ? "quote l" : "quote";
}

function buildYou() {
  const s = parseSince(myStart()), d = elapsed(s.date).days, ms = milestone(d);
  const R = 84, C = 2 * Math.PI * R, prog = Math.min(1, (d - ms.prev) / (ms.next - ms.prev));
  const card = document.createElement("article");
  card.className = "card you";
  card.style.cssText = tintVars(YOU_TINT);
  card.innerHTML = `
    <div class="wash"></div>
    <div class="ring-wrap" aria-hidden="true">
      <svg class="ring" viewBox="0 0 200 200">
        <defs><linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff375f"/><stop offset="1" stop-color="#ff9f0a"/></linearGradient></defs>
        <circle class="track" cx="100" cy="100" r="${R}" fill="none" stroke-width="22"/>
        <circle class="bar" cx="100" cy="100" r="${R}" fill="none" stroke="url(#ring-grad)" stroke-width="22" stroke-linecap="round"
          stroke-dasharray="${C}" stroke-dashoffset="${C}" style="--off:${C * (1 - Math.max(prog, .015))}" transform="rotate(-90 100 100)"/>
      </svg>
      <div class="ring-label"><span>다음 목표</span><b>${dayLabel(ms.next)}</b><em>${(ms.next - d).toLocaleString("ko-KR")}일 남음</em></div>
    </div>
    <div class="copy">
      <div class="tally"><span class="num">${d.toLocaleString("ko-KR")}</span><span class="unit">일</span></div>
      <div class="since">${d === 0 ? "오늘부터 금주 시작" : sinceLong(s)}</div>
      <div class="byline"><div class="who"><span class="name">나</span><span class="role">나의 기록</span></div>
        <button class="more glass" type="button" data-mine>날짜 ${CHEVRON_UP}</button></div>
    </div>`;
  card._ready = Promise.resolve();
  return card;
}

function buildCard(id) {
  if (id === "you") return buildYou();
  const p = BY_ID[id], s = parseSince(p.since), [n, unit] = tally(elapsed(s.date));
  const lang = p.lang || "en";
  const card = document.createElement("article");
  card.className = "card";
  card.style.cssText = tintVars(p.tint);
  card.innerHTML = `
    <div class="wash" style="background-image:url(photos/wash/${id}.jpg?v=${PHOTO_V})"></div>
    <div class="photo"><div class="kb"><img alt="${esc(p.name)}" decoding="async"></div></div>
    <div class="top-shade"></div>
    <div class="copy">
      <div class="tally"><span class="num">${n}</span><span class="unit">${unit}</span></div>
      <div class="since">${sinceLong(s, p.approx)}</div>
      <blockquote class="${quoteClass(p)}" lang="${lang}">${(p.roman || lang === "ja" ? esc(p.quote) : "“" + esc(p.quote) + "”").replace(/\n/g, "<br>")}</blockquote>
      <p class="ko" lang="ko">${esc(p.line)}</p>
      <div class="byline"><div class="who"><span class="name">${esc(p.name)}</span><span class="role">${esc(p.ko)} · ${esc(p.role)}</span></div>
        <button class="more glass" type="button" data-story>이야기 ${CHEVRON_UP}</button></div>
    </div>`;
  card._focus = p.focus;
  const img = card.querySelector("img");
  card._ready = new Promise(res => {
    img.onload = () => { place(card); res(); };
    img.onerror = () => { img.remove(); res(); };
    img.src = `photos/${id}.jpg?v=${PHOTO_V}`;
    if (img.complete && img.naturalWidth) { place(card); res(); }
  });
  return card;
}

function place(card) {
  const img = card.querySelector("img");
  if (!img || !img.naturalWidth) return;
  // The photo covers the full width and at least the top 72% of the screen;
  // below that it fades into its own blurred wash, where the text sits.
  const cw = stage.clientWidth, ch = stage.clientHeight, H = 0.72;
  const [fx, fy] = card._focus;
  const s = Math.max(cw / img.naturalWidth, (ch * H) / img.naturalHeight) * 1.03;
  const w = img.naturalWidth * s, h = img.naturalHeight * s;
  const x = Math.min(0, Math.max(cw - w, cw / 2 - fx * w));
  const y = Math.min(0, Math.max(ch * H - h, ch * 0.32 - fy * h));
  img.style.width = w + "px";
  img.style.height = h + "px";
  img.style.transform = `translate3d(${x}px, ${y}px, 0)`;
  card.querySelector(".kb").style.transformOrigin = `${x + fx * w}px ${y + fy * h}px`;
}

let current = null;
function show(id) {
  const card = buildCard(id);
  card.dataset.id = id;
  deck.appendChild(card);
  current = id;
  applyTint(id === "you" ? YOU_TINT : BY_ID[id].tint);
  const reveal = () => {
    if (!card.isConnected) return;
    void card.offsetWidth; // commit the hidden state so the fade runs
    card.classList.add("in");
    setTimeout(() => {
      [...deck.children].forEach(c => { if (c !== card && c.compareDocumentPosition(card) & Node.DOCUMENT_POSITION_FOLLOWING) c.remove(); });
    }, 900);
  };
  Promise.race([card._ready, new Promise(r => setTimeout(r, 900))]).then(reveal);
}

/* ── deck order: shuffle bag, no repeats until everyone is seen ── */
let bag = [];
const history = [];
let pos = -1;

function roster() {
  const list = PEOPLE.map(p => p.id);
  if (myStart()) list.push("you");
  return list;
}
function refill() {
  const a = roster();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  const last = history[history.length - 1];
  if (a.length > 1 && a[a.length - 1] === last) [a[0], a[a.length - 1]] = [a[a.length - 1], a[0]];
  bag = a;
}
function draw() {
  if (!bag.length) refill();
  return bag.pop();
}
function preloadAhead() {
  if (bag.length < 2) {
    const rest = bag.slice();
    refill();
    bag = bag.filter(id => !rest.includes(id)).concat(rest);
  }
  bag.slice(-2).forEach(id => { if (id !== "you") { const im = new Image(); im.src = `photos/${id}.jpg?v=${PHOTO_V}`; } });
}

function next() {
  if (pos < history.length - 1) pos++;
  else { history.push(draw()); pos = history.length - 1; }
  show(history[pos]);
  preloadAhead();
  dismissHint();
}
function prev() {
  if (pos <= 0) return;
  pos--;
  show(history[pos]);
}

/* ── hint (first run only) ───────────────── */
const HINT_KEY = "aa.seenHint";
let hintTimer;
function showHint() {
  if (store.get(HINT_KEY)) return;
  $("hint").classList.remove("gone");
  hintTimer = setTimeout(dismissHint, 5000);
}
function dismissHint() {
  clearTimeout(hintTimer);
  if ($("hint").classList.contains("gone")) return;
  $("hint").classList.add("gone");
  store.set(HINT_KEY, "1");
}

/* ── sheets ──────────────────────────────── */
let openSheet = null;
function open(sheet) {
  if (openSheet) close();
  openSheet = sheet;
  sheet.inert = false;
  sheet.scrollTop = 0;
  sheet.classList.add("open");
  $("scrim").classList.add("open");
  dismissHint();
}
function close() {
  if (!openSheet) return;
  openSheet.classList.remove("open");
  openSheet.inert = true;
  $("scrim").classList.remove("open");
  openSheet = null;
  if (current) applyTint(current === "you" ? YOU_TINT : BY_ID[current].tint);
  stage.focus({ preventScroll: true });
}

function openStory() {
  if (current === "you") return openMine();
  const p = BY_ID[current];
  if (!p) return;
  const s = parseSince(p.since), e = elapsed(s.date), cr = CREDITS[p.id];
  $("s-name").textContent = p.name;
  $("s-sub").textContent = `${p.ko} · ${p.role}`;
  $("s-since").textContent = sinceShort(s, p.approx);
  if (s.prec === "year") { $("s-count-label").textContent = "지난 해"; $("s-count").textContent = (p.approx ? "약 " : "") + e.years + "년"; }
  else { $("s-count-label").textContent = "지난 날"; $("s-count").textContent = (s.prec === "month" ? "약 " : "") + e.days.toLocaleString("ko-KR") + "일"; }
  $("s-story").textContent = p.story;
  const q = $("s-quote");
  q.lang = p.lang || "en";
  q.textContent = p.roman || p.lang === "ja" ? p.quote.replace(/\n/g, "") : `“${p.quote}”`;
  $("s-src").innerHTML = `${esc(p.src[0])} · <a href="${esc(p.src[1])}" target="_blank" rel="noopener">원문 기사</a>`;
  $("s-credit").innerHTML = cr
    ? `사진 · ${esc(cr[0])} · ${esc(cr[1])} · <a href="https://commons.wikimedia.org/wiki/${cr[2]}" target="_blank" rel="noopener">Wikimedia Commons</a>`
    : "";
  open($("story"));
}

function openMine() {
  const input = $("my-start");
  const t = new Date(), today = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
  input.max = today;
  input.value = myStart() || today;
  $("my-clear").hidden = !myStart();
  if (current !== "you" && !myStart()) applyTint(YOU_TINT);
  open($("mine"));
}

$("my-save").addEventListener("click", () => {
  const v = $("my-start").value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
  const had = !!myStart();
  store.set(MY_KEY, v);
  renderMe();
  if (!had && !bag.includes("you")) bag.splice(Math.floor(Math.random() * (bag.length + 1)), 0, "you");
  close();
  show("you");
  history.splice(pos + 1, 0, "you"); pos++;
});
$("my-clear").addEventListener("click", () => {
  store.set(MY_KEY, null);
  bag = bag.filter(id => id !== "you");
  renderMe();
  close();
  if (current === "you") next();
});

document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
$("scrim").addEventListener("click", close);
$("me").addEventListener("click", openMine);

// swipe down on a sheet (at its top) closes it
document.querySelectorAll(".sheet").forEach(sh => {
  let y0 = null;
  sh.addEventListener("touchstart", e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, { passive: true });
  sh.addEventListener("touchend", e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 70) close(); y0 = null; });
});

/* ── stage gestures ──────────────────────── */
let start = null;
stage.addEventListener("pointerdown", e => {
  if (e.target.closest("button, a, input")) { start = null; return; }
  start = { x: e.clientX, y: e.clientY };
});
stage.addEventListener("pointerup", e => {
  if (!start) return;
  const dx = e.clientX - start.x, dy = e.clientY - start.y;
  start = null;
  if (Math.abs(dy) > 48 && Math.abs(dy) > Math.abs(dx)) { if (dy < 0) openStory(); return; }
  if (Math.abs(dx) > 48) { dx < 0 ? next() : prev(); return; }
  if (Math.abs(dx) < 12 && Math.abs(dy) < 12) next();
});
stage.addEventListener("pointercancel", () => { start = null; });
stage.addEventListener("click", e => {
  if (e.target.closest("[data-story]")) openStory();
  else if (e.target.closest("[data-mine]")) openMine();
});
stage.addEventListener("contextmenu", e => e.preventDefault());

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { close(); return; }
  if (openSheet || e.target.closest("input, button, a")) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "Enter") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft") prev();
  else if (e.key === "ArrowUp") { e.preventDefault(); openStory(); }
});

let rz;
addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => deck.querySelectorAll(".card").forEach(place), 80); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) renderMe(); });

/* ── go ──────────────────────────────────── */
renderMe();
next();
showHint();

// Offline cache for the home-screen app (skipped where there is no manifest)
if ("serviceWorker" in navigator && document.querySelector('link[rel="manifest"]')) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
